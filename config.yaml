# Configuration générale de renpy_maker.
# Chemins absolus pour rester valables quel que soit le répertoire de lancement.

project:
  name: "premier_chapitre"
  language: "fr"
  game_dir: "/home/yopla/PycharmProjects/renpy_maker/game_project"   # contient game/
  spec_dir: "/home/yopla/PycharmProjects/renpy_maker/game_spec"      # spec YAML = source de vérité
  work_dir: "/home/yopla/PycharmProjects/renpy_maker/work"           # brouillons, logs, sorties intermédiaires

renpy:
  sdk_dir: "/home/yopla/PycharmProjects/renpy_maker/tools/renpy-8.3.7-sdk"

# Écrivain : fournisseur interchangeable. Un seul "active" à la fois.
llm:
  active: anthropic
  providers:
    anthropic:
      model: "claude-sonnet-5-5"
      api_key_env: "ANTHROPIC_API_KEY"     # clé lue dans l'environnement, jamais écrite ici
      max_tokens: 8000
      temperature: 1.0
    openai:
      model: "gpt-5"                       # à confirmer
      api_key_env: "OPENAI_API_KEY"
      max_tokens: 8000
      temperature: 1.0
    ollama:                                # modèle local, ouvert
      model: "qwen3:14b"                   # à choisir selon la machine
      base_url: "http://localhost:11434"
      max_tokens: 8000
      temperature: 0.9
    replicate:                             # textes sur Replicate (même clé que les images)
      model: "meta/meta-llama-3-70b-instruct"
      max_tokens: 4000
      temperature: 0.9

# Contenu du chapitre (ce qui est demandé à l'écrivain).
story:
  chapter_title: "Chapitre 1"
  scenes_target: 6
  content_rating: "adult"                  # indication transmise au prompt de l'écrivain
  # Le fournisseur doit autoriser ce type de contenu (voir la politique d'usage du fournisseur).

# Style visuel : à fixer au début de chaque projet.
visual_style:
  name: "3D réaliste"                      # rendu CGI réaliste, style des jeux Ren'Py adultes
  # Sans sujet (« character », « skin ») : ce suffixe termine aussi les prompts des lieux et des objets.
  positive_suffix: "photorealistic 3D render, cinematic CGI look, soft cinematic lighting, fine realistic detail"
  negative_prompt: "low quality, blurry, deformed, watermark, text, cartoon, anime, flat shading"
  seed: 42                                 # graine de référence pour les ancres

# ComfyUI : images et vidéos.
comfy:
  url: "http://127.0.0.1:8188"             # à confirmer (port par défaut ComfyUI)
  # Libérer la mémoire de ComfyUI avant chaque génération. Dépend de la machine : à activer si la
  # carte est trop petite pour garder plusieurs modèles chargés (ex. 16 Go). Modifiable dans la roue.
  free_memory_before_generation: false
  # Mémoire partagée entre Ollama (LLM local) et ComfyUI : à régler selon la machine (roue de réglages).
  unload_ollama_before_comfy: true     # décharger les modèles Ollama avant une génération ComfyUI
  free_comfy_before_ollama: false      # libérer ComfyUI avant un appel Ollama (ralentit la génération suivante)
  models_dir: "/home/yopla/Applications/SD/comfyui/Comfyui/models"
  image:
    # Modèle image à valider sur cette machine (voir unet/ : zImageTurbo, qwen_image, flux...).
    unet: "zImageTurbo_turbo.safetensors"
    text_encoder: "qwen_3_4b.safetensors"  # dossier clip/ — à confirmer pour ce modèle
    vae: "ae.safetensors"                  # dossier vae/ — à confirmer pour ce modèle
    width: 832
    height: 1216
    steps: 8
    cfg: 1.0
  video:
    # Wan 2.2 image->vidéo, deux passes (high noise puis low noise), avec image de départ et de fin.
    # Nœud ComfyUI : WanFirstLastFrameToVideo (comfy_extras/nodes_wan.py).
    unet_high: "wan2.2_i2v_high_noise_14B_Q4_K_S.gguf"     # dossier diffusion_models/
    unet_low: "wan2.2_i2v_low_noise_14B_Q4_K_S.gguf"       # dossier diffusion_models/
    text_encoder: "umt5_xxl_fp8_e4m3fn_scaled.safetensors" # dossier text_encoders/
    vae: "wan_2.1_vae.safetensors"                          # dossier vae/
    width: 640
    height: 640
    length_frames: 81
    fps: 16
    steps_high: 10
    steps_low: 10
    cfg: 3.5
    # Limite connue : les modèles i2v Wan 2.2 présents ne sont pas des modèles "first-last-frame"
    # entraînés ; la qualité de la fin de plan est à valider par un test.

# Modèle d'écriture par tâche. Vide (null) = fournisseur d'écriture du projet.
# Un choix fait dans la roue de réglages remplace ces valeurs (game_spec/app_settings.yaml).
llm_tasks:
  histoire: {provider: null, model: null}   # plan des chapitres
  dialogue: {provider: null, model: null}   # répliques
  prompt:   {provider: null, model: null}   # prompts d'image et découpage en plans
  decision: {provider: null, model: null}   # oui/non : le texte d'un plan change-t-il une tenue ? (modèle léger conseillé)

# Moteur d'image par rôle. base : sans référence (« équivalent FLUX 1 »).
# edit : avec images de référence (« équivalent Klein »). engine : replicate ou comfyui.
# workflow : fichier de workflow ComfyUI (format API), chemin absolu ou relatif au projet.
image_engines:
  base: {engine: replicate, workflow: null}
  edit: {engine: replicate, workflow: null}

# Nombre d'étapes d'échantillonnage par rôle (ComfyUI). null = valeur du workflow.
# Plus d'étapes : image plus fine mais plus lente.
comfy_steps:
  base: null
  edit: null

# Workflow ComfyUI proposé par défaut quand on choisit ComfyUI pour un rôle (chemins relatifs au projet).
comfy_workflows:
  base: comfy/workflows/FLUX1_API.json                  # FLUX 1, génération sans référence
  edit: comfy/workflows/FLUX_KLEIN3_EDIT_API.json       # Klein 9B, retouche avec références
