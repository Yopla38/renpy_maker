<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes histoires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6efe3;
  --card: #fffdf8;
  --ink: #2b2730;
  --muted: #7b7282;
  --accent: #c4623f;
  --accent-soft: #f5e1d6;
  --sage: #5d8b7b;
  --line: #e8dccb;
  --danger: #a13a3a;
  --shadow: 0 1px 2px rgba(70, 45, 20, .06), 0 16px 40px rgba(70, 45, 20, .10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1f1b19; --card: #2a2522; --ink: #f2ebe2; --muted: #a79c92;
    --accent: #e08a68; --accent-soft: #3a2c25; --sage: #8fbfae; --line: #3d3530;
    --shadow: 0 16px 40px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --paper: #1f1b19; --card: #2a2522; --ink: #f2ebe2; --muted: #a79c92;
  --accent: #e08a68; --accent-soft: #3a2c25; --sage: #8fbfae; --line: #3d3530;
  --shadow: 0 16px 40px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper);
  font: 400 17px/1.55 Nunito, system-ui, sans-serif;
}
header.top {
  max-width: 1040px; margin: 0 auto; padding: 36px 16px 8px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.brand { font: 700 30px/1.1 Fraunces, Georgia, serif; margin: 0; letter-spacing: -.01em; }
.brand small { display: block; font: 600 14px Nunito, sans-serif; color: var(--muted); margin-top: 6px; }
main { max-width: 1040px; margin: 18px auto 60px; padding: 0 16px; }

.msg { border-radius: 14px; padding: 12px 16px; margin: 0 0 18px; background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.msg.error { background: #f6dede; color: var(--danger); }

.current {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: space-between;
  background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--sage);
  border-radius: 20px; box-shadow: var(--shadow); padding: 18px 22px; margin-bottom: 26px;
}
.current .label { font: 800 12px Nunito, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--sage); }
.current .title { font: 700 22px Fraunces, Georgia, serif; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column; min-width: 0; transition: transform .15s, border-color .15s;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card.is-current { border-color: var(--sage); }
.cover { aspect-ratio: 16 / 10; background: var(--accent-soft); position: relative; overflow: hidden; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .initial {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 700 56px Fraunces, Georgia, serif; color: rgba(255, 255, 255, .85);
}
.badge {
  position: absolute; top: 12px; left: 12px; background: rgba(43, 39, 48, .72); color: #fff;
  border-radius: 999px; padding: 4px 11px; font: 800 12px Nunito, sans-serif;
}
.body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.name { font: 700 19px/1.25 Fraunces, Georgia, serif; margin: 0; overflow-wrap: anywhere; }
.idea { color: var(--muted); font-size: 15px; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { color: var(--muted); font-size: 13px; font-weight: 600; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 10px; align-items: center; }
button { font: 800 15px Nunito, sans-serif; cursor: pointer; border-radius: 12px; padding: 9px 16px; transition: .15s; }
button:disabled { opacity: .45; cursor: not-allowed; }
.primary { background: var(--accent); color: #fff; border: 0; box-shadow: 0 6px 16px rgba(196, 98, 63, .3); }
.primary:not(:disabled):hover { filter: brightness(1.05); }
.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.ghost:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
.quiet { background: none; border: 0; color: var(--muted); padding: 8px 6px; font-size: 14px; }
.quiet:hover { color: var(--danger); }
.danger { background: var(--danger); color: #fff; border: 0; }

.new {
  border: 2px dashed var(--line); border-radius: 20px; background: transparent; min-height: 260px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  color: var(--muted); padding: 22px; text-align: center;
}
.new:hover { border-color: var(--accent); color: var(--accent); }
.new .plus { font: 700 48px/1 Fraunces, Georgia, serif; }
.new.open { cursor: default; align-items: stretch; text-align: left; color: var(--ink); background: var(--card); border-style: solid; }
.new.open:hover { border-color: var(--line); color: var(--ink); }
.new label { display: grid; gap: 6px; font: 800 14px Nunito, sans-serif; color: var(--muted); }
.new input, .new textarea, .rename input {
  font: 400 16px Nunito, sans-serif; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%;
}
.new textarea { min-height: 110px; resize: vertical; }
.new .row, .rename .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.rename { display: grid; gap: 8px; }
.confirm { color: var(--danger); font-weight: 700; font-size: 15px; margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
footer.foot { max-width: 1040px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: 13px; }

@media (max-width: 520px) {
  .brand { font-size: 26px; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">Mes histoires<small>Reprenez une histoire ou commencez-en une nouvelle</small></h1>
</header>
<main>
  <div id="msg" class="msg" hidden></div>
  <div id="current"></div>
  <section class="grid" id="grid"><p class="empty">Chargement…</p></section>
</main>
<footer class="foot">Vos histoires sont enregistrées sur cet appareil. Une histoire supprimée part dans work/corbeille/.</footer>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Erreur ${res.status}`);
  return data;
}

let state = { projects: [], current: null };
let ui = { renaming: null, confirming: null, creating: false, busy: false };

function say(text, error = false) {
  const box = document.getElementById("msg");
  box.hidden = !text;
  box.className = "msg" + (error ? " error" : "");
  box.textContent = text || "";
}

function hue(id) {
  let h = 0;
  for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}

function cover(p) {
  if (p.thumbnail) return `<img src="${esc(p.thumbnail)}" alt="">`;
  const initial = esc((p.name || "?").trim().charAt(0).toUpperCase());
  return `<div class="initial" style="background: linear-gradient(135deg, hsl(${hue(p.id)} 45% 58%), hsl(${(hue(p.id) + 40) % 360} 50% 36%))">${initial}</div>`;
}

function countText(p) {
  if (p.empty) return "Pas encore de scène";
  const c = p.chapters > 1 ? `${p.chapters} chapitres` : `${p.chapters} chapitre`;
  const s = p.scenes > 1 ? `${p.scenes} scènes` : `${p.scenes} scène`;
  return `${c} · ${s}`;
}

function cardActions(p) {
  if (ui.renaming === p.id) {
    return `<div class="rename" style="width:100%">
      <input id="rename-input" value="${esc(p.name)}" maxlength="80" aria-label="Nouveau titre">
      <div class="row"><button class="ghost small" data-act="cancel">Annuler</button>
      <button class="primary small" data-act="save-rename" data-id="${esc(p.id)}">Enregistrer</button></div></div>`;
  }
  if (ui.confirming === p.id) {
    return `<p class="confirm" style="width:100%">Supprimer « ${esc(p.name)} » ? Elle sera déplacée dans work/corbeille/.</p>
      <div class="row" style="width:100%; justify-content:flex-end"><button class="ghost" data-act="cancel">Non, garder</button>
      <button class="danger" data-act="delete" data-id="${esc(p.id)}">Oui, supprimer</button></div>`;
  }
  const open = `<button class="primary" data-act="open" data-id="${esc(p.id)}" ${ui.busy ? "disabled" : ""}>${p.current ? "Continuer" : "Ouvrir"}</button>
    <button class="ghost small" data-act="settings" data-id="${esc(p.id)}" ${ui.busy ? "disabled" : ""} title="Modèles de texte, moteurs d'image, ComfyUI">Réglages</button>`;
  const rename = p.origin ? "" : `<button class="quiet" data-act="rename" data-id="${esc(p.id)}">Renommer</button>`;
  const del = p.origin || p.current ? "" : `<button class="quiet" data-act="confirm-delete" data-id="${esc(p.id)}">Supprimer</button>`;
  return `${open}${rename}${del}`;
}

function card(p) {
  const badge = p.current ? `<span class="badge">Ouverte</span>` : p.origin ? `<span class="badge">D'origine</span>` : "";
  return `<article class="card ${p.current ? "is-current" : ""}">
    <div class="cover">${cover(p)}${badge}</div>
    <div class="body">
      <h2 class="name">${esc(p.name)}</h2>
      ${p.idea ? `<p class="idea">${esc(p.idea)}</p>` : `<p class="idea">Sans idée écrite pour l'instant.</p>`}
      <div class="meta">${esc(countText(p))}${p.updated ? ` · modifiée le ${esc(p.updated)}` : ""}</div>
      <div class="actions">${cardActions(p)}</div>
    </div>
  </article>`;
}

function newCard() {
  if (!ui.creating) {
    return `<button class="card new" data-act="new">
      <span class="plus">+</span><span><strong>Nouvelle histoire</strong></span>
      <span style="font-size:14px">Un titre, une idée, et c'est parti.</span></button>`;
  }
  return `<form class="card new open" id="new-form" style="padding:20px; gap:12px">
    <h2 class="name" style="margin:0">Nouvelle histoire</h2>
    <label>Titre<input id="new-name" maxlength="80" placeholder="Par exemple : Le manoir du lac" required></label>
    <label>Idée (facultatif)<textarea id="new-idea" placeholder="Quelques phrases sur l'histoire, les personnages, le ton…"></textarea></label>
    <div class="row"><button type="button" class="ghost small" data-act="cancel-new">Annuler</button>
    <button type="submit" class="primary small" ${ui.busy ? "disabled" : ""}>Créer et ouvrir</button></div>
  </form>`;
}

function render() {
  const cur = state.current;
  document.getElementById("current").innerHTML = cur && !ui.creating ? `<div class="current">
    <div><div class="label">Histoire en cours</div><div class="title">${esc(cur.name)}</div></div>
    <button class="primary" onclick="location.href='/facile'">Continuer à écrire</button></div>` : "";
  const grid = document.getElementById("grid");
  const list = state.projects.map(card).join("");
  grid.innerHTML = list + newCard();
  if (!state.projects.length && !ui.creating) {
    grid.insertAdjacentHTML("afterbegin", `<p class="empty" style="grid-column: 1 / -1">Aucune histoire pour le moment. Commencez-en une !</p>`);
  }
  const input = document.getElementById("rename-input");
  if (input) { input.focus(); input.select(); }
  const name = document.getElementById("new-name");
  if (name && ui.creating && !name.value) name.focus();
}

async function load() {
  try {
    const data = await api("GET", "/api/facile/projects");
    state = { projects: data.projects, current: data.current };
    render();
  } catch (e) {
    say(e.message, true);
  }
}

async function run(fn) {
  ui.busy = true;
  render();
  try {
    await fn();
  } catch (e) {
    say(e.message, true);
  }
  ui.busy = false;
  render();
}

async function openProject(id, toSettings = false) {
  await run(async () => {
    await api("POST", "/api/facile/projects/open", { id });
    location.href = toSettings ? "/facile?reglages=1" : "/facile";
  });
}

document.addEventListener("click", (ev) => {
  const btn = ev.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  const id = btn.dataset.id;
  if (act === "open") return openProject(id);
  if (act === "settings") return openProject(id, true);
  if (act === "new") { ui.creating = true; say(""); return render(); }
  if (act === "cancel-new") { ui.creating = false; return render(); }
  if (act === "rename") { ui.renaming = id; ui.confirming = null; return render(); }
  if (act === "cancel") { ui.renaming = null; ui.confirming = null; return render(); }
  if (act === "confirm-delete") { ui.confirming = id; ui.renaming = null; return render(); }
  if (act === "save-rename") {
    const name = document.getElementById("rename-input").value;
    return run(async () => {
      await api("POST", "/api/facile/projects/rename", { id, name });
      ui.renaming = null;
      await load();
    });
  }
  if (act === "delete") {
    return run(async () => {
      await api("POST", "/api/facile/projects/delete", { id });
      ui.confirming = null;
      say("Histoire déplacée dans la corbeille.");
      await load();
    });
  }
});

document.addEventListener("submit", (ev) => {
  if (ev.target.id !== "new-form") return;
  ev.preventDefault();
  const name = document.getElementById("new-name").value;
  const idea = document.getElementById("new-idea").value;
  return run(async () => {
    await api("POST", "/api/facile/projects/create", { name, idea });
    location.href = "/facile?reglages=1";  // configurer les moteurs et les modèles avant d'écrire quoi que ce soit
  });
});

load();
</script>
</body>
</html>
