async function changeRefs(sid, pid, change) {
  err = "";
  try {
    await saveDraftIfAny(sid);
    const p = V.scenes.find((x) => x.id === sid).plans.find((x) => x.id === pid);
    const exclude = p.refs.auto.filter((a) => a.excluded).map((a) => a.key);
    const extra = p.refs.extra.slice();
    change(exclude, extra);
    await api("POST", "/api/facile/plan/refs", { scene: sid, plan: pid, exclude, extra });
    await load();
  } catch (e) { err = e.message; }
  render();
}

// Continuité : l'image du plan précédent sert de référence (ou la tenue d'origine de la scène).
async function setContinuity(sid, pid, on) {
  err = "";
  try {
    await saveDraftIfAny(sid);
    await api("POST", "/api/facile/plan/continuity", { scene: sid, plan: pid, on });
    await load();
  } catch (e) { err = e.message; }
  render();
}

function toggleRef(sid, pid, ai) {
  const key = V.scenes.find((x) => x.id === sid).plans.find((x) => x.id === pid).refs.auto[ai].key;
  return changeRefs(sid, pid, (exclude) => {
    const i = exclude.indexOf(key);
    if (i >= 0) exclude.splice(i, 1); else exclude.push(key);
  });
}

function addRef(sid, pid, aid) {
  return changeRefs(sid, pid, (_, extra) => {
    const i = extra.indexOf(aid);
    if (i >= 0) extra.splice(i, 1); else extra.push(aid);
  });
}





// --- Étape Plans : les routes en lignes, chaque image en carte ; un clic ouvre son encart complet.
let planOpen = null;     // {sid, k} : image ouverte dans l'encart
let branchDraft = null;  // {sid, pid, label, title} : bifurcation en cours de saisie
const ROUTE_COLORS = ["#2F6FD6", "#F08A3C", "#5D8B7B", "#A13A3A", "#8F6FD6"];

function routeLanes() {
  const m = V.map;
  if (!m || !m.start) return [];
  const out = (sid) => m.edges.filter((e) => e.source === sid);
  const placed = new Set(), rows = [], queue = [{ start: m.start, parent: null, label: "" }];
  while (queue.length) {
    const job = queue.shift();
    const row = { scenes: [], parent: job.parent, label: job.label, joinTo: null, joins: [],
      depth: job.parent === null ? 0 : rows[job.parent].depth + 1 };
    rows.push(row);
    const idx = rows.length - 1;
    let cur = job.start;
    while (cur) {
      if (placed.has(cur)) { row.joinTo = cur; break; }   // la ligne rejoint une scène déjà placée
      placed.add(cur);
      row.scenes.push(cur);
      const es = out(cur);
      const choices = es.filter((e) => e.kind === "choice");
      if (choices.length) {
        // « Continuer » reste dans la même ligne ; les autres chemins ouvrent une ligne en dessous.
        const cont = choices.find((e) => e.label === "Continuer");
        choices.filter((e) => e !== cont).forEach((c) => queue.push({ start: c.target, parent: idx, label: c.label }));
        cur = cont ? cont.target : null;
      } else {
        const nx = es.find((e) => e.kind === "next");
        cur = nx ? nx.target : null;
      }
    }
  }
  const rest = V.scenes.map((s) => s.id).filter((id) => !placed.has(id));
  if (rest.length) rows.push({ scenes: rest, parent: null, label: "À rattacher", joinTo: null, joins: [], depth: 0, orphan: true });
  return rows;
}

function routeColor(row) {
  return row.parent === null ? "#8C8294" : ROUTE_COLORS[(row.depth - 1) % ROUTE_COLORS.length];
}

function planCardHtml(s, r, k, busy) {
  const vp = s.plans.find((p) => p.id === r.id);
  const shown = vp && vp.image;
  const img = shown ? `<img src="${esc(vp.image)}" alt="">` : `<span class="ph">${vp ? "Pas encore d'image" : "À enregistrer"}</span>`;
  const text = (r.text || "").trim();
  return `<button class="pcard ${shown ? "" : "empty"}" onclick="openPlan('${esc(s.id)}', ${k})">
    <span class="pimg">${img}</span>
    <span class="pmeta"><b>${k + 1}</b>${r.pause ? `<i>seule</i>` : ""}</span>
    <span class="ptext">${esc(text.slice(0, 64) || "Sans description")}</span></button>`;
}

function cardJoinHtml(s, r, busy) {
  const ready = !!r.id;
  return `<button class="pjoin" title="${ready ? "Bifurquer ici : la suite devient une route" : "Enregistrez d'abord le découpage"}"
    onclick="openBranch('${esc(s.id)}', '${esc(r.id || "")}')" ${busy || !ready ? "disabled" : ""}>＋</button>`;
}

function segmentHtml(sid, busy) {
  const s = V.scenes.find((x) => x.id === sid);
  if (!s) return "";
  const rows = planRows(s);
  const dirty = !!planDraft[s.id];
  const cards = rows.map((r, k) => (k > 0 ? cardJoinHtml(s, r, busy) : "") + planCardHtml(s, r, k, busy)).join("");
  return `<div class="segment">
    <div class="segment-head"><b>${esc(s.title)}</b>
      <span class="seg-actions">
        <button class="link" onclick="proposePlans('${esc(s.id)}')" ${busy || !s.dialogue.length ? "disabled" : ""}>${s.plans.length ? "Reproposer" : "Proposer le découpage"}</button>
        <button class="link" onclick="savePlans('${esc(s.id)}')" ${busy || !dirty || planSaving[s.id] ? "disabled" : ""}>${planSaving[s.id] ? "Enregistrement…" : dirty ? "Enregistrer" : "Enregistré"}</button>
      </span></div>
    <div class="cards">${cards || `<p class="notice">Pas encore d'images.</p>`}
      <button class="padd" title="Ajouter une image" onclick="addPlanRow('${esc(s.id)}')" ${busy || !s.dialogue.length ? "disabled" : ""}>+</button></div>
  </div>`;
}

function laneHtml(row, busy) {
  const color = routeColor(row);
  const first = row.scenes[0];
  const title = row.parent === null ? (row.orphan ? "Scènes à rattacher" : "Histoire principale") : `↳ ${row.label}`;
  const detach = row.parent !== null && first
    ? `<button class="lane-remove" title="Retirer cette route : son contenu part dans la réserve" onclick="detachRoute('${esc(first)}')" ${busy ? "disabled" : ""}>−</button>` : "";
  const last = row.scenes[row.scenes.length - 1];
  const endNode = last ? V.map.nodes.find((n) => n.id === last) : null;
  const hasOut = last ? V.map.edges.some((e) => e.source === last) : true;
  const rejoin = !row.joinTo && last && endNode && !endNode.ending && !hasOut && V.scenes.length > 1
    ? `<label class="rejoin">Suite :
        <select onchange="rejoinScene('${esc(last)}', this.value)" ${busy ? "disabled" : ""}>
          <option value="">— choisir la scène qui suit —</option>
          ${V.scenes.filter((x) => x.id !== last).map((x) => `<option value="${esc(x.id)}">${esc(x.title)}</option>`).join("")}
        </select></label>` : "";
  const joined = row.joinTo ? `<span class="join-chip">↪ rejoint « ${esc(titleOf(V.map, row.joinTo))} »</span>` : "";
  return `<section class="lane ${row.parent === null ? "main" : "branch"}" style="--c: ${color}; margin-left: ${row.depth * 26}px">
    <header class="lane-head"><span class="lane-title">${esc(title)}</span>${detach}</header>
    <div class="track">${row.scenes.map((sid) => segmentHtml(sid, busy)).join("")}${joined}${rejoin}</div>
  </section>`;
}

function reserveHtml(busy) {
  const blocks = V.reserve || [];
  if (!blocks.length) return "";
  return `<section class="reserve">
    <h3>Réserve</h3>
    <p class="notice">Contenus retirés des routes. Rien n'est perdu : vous pouvez les rattacher à une autre scène.</p>
    <div class="rcards">${blocks.map((b) => `<div class="rcard">
      <b>${esc(b.title)}</b>
      <span class="notice">${b.plans.length} image(s) · ${b.dialogue.length} réplique(s)</span>
      <select id="rs-${esc(b.id)}">${V.scenes.map((x) => `<option value="${esc(x.id)}">${esc(x.title)}</option>`).join("")}</select>
      <input id="rl-${esc(b.id)}" maxlength="60" placeholder="Libellé du choix, ex. : Revenir">
      <button class="primary small" onclick="attachBlock('${esc(b.id)}')" ${busy ? "disabled" : ""}>Rattacher</button>
    </div>`).join("")}</div>
  </section>`;
}

function modalHtml(title, inner, close) {
  return `<div class="overlay" onclick="if (event.target === this) ${close}">
    <div class="modal" role="dialog" aria-label="${esc(title)}">
      <div class="modal-head"><h3>${title}</h3><button class="close" onclick="${close}" aria-label="Fermer">×</button></div>
      <div class="modal-body">${inner}</div>
    </div></div>`;
}

function overlayHtml(busy) {
  if (planOpen) {
    const s = V.scenes.find((x) => x.id === planOpen.sid);
    const r = s ? planRows(s)[planOpen.k] : null;
    if (s && r) return modalHtml(`${esc(s.title)} · image ${planOpen.k + 1}`, planHtml(s, r, planOpen.k, busy), "closePlan()");
  }
  if (branchDraft) {
    const inner = `<p class="notice">La suite reste dans cette scène jusqu'à cette image. Le choix envoie vers une route vide,
        à remplir ici avec ses propres images.</p>
      <label>Libellé du choix<input id="br-label" maxlength="60" placeholder="ex. : Accepter" value="${esc(branchDraft.label)}"
        oninput="branchDraft.label = this.value"></label>
      <label>Titre de la route<input id="br-title" maxlength="80" placeholder="ex. : Le rôle" value="${esc(branchDraft.title)}"
        oninput="branchDraft.title = this.value"></label>
      <div class="actions"><button class="ghost small" onclick="closeBranch()">Annuler</button>
        <button class="primary small" onclick="createBranch()" ${busy ? "disabled" : ""}>Créer la route</button></div>`;
    return modalHtml("Nouvelle bifurcation", inner, "closeBranch()");
  }
  return "";
}

function openPlan(sid, k) {
  if (job) return;
  planOpen = { sid, k };
  err = "";
  render();
}

function closePlan() {
  planOpen = null;
  render();
}

function openBranch(sid, pid) {
  if (job || !pid) return;
  branchDraft = { sid, pid, label: "", title: "" };
  err = "";
  render();
}

function closeBranch() {
  branchDraft = null;
  render();
}

async function reloadView() {
  V = await api("GET", "/api/facile");
}

async function createBranch() {
  if (!branchDraft || job) return;
  try {
    await api("POST", "/api/facile/branch", { scene: branchDraft.sid, plan: branchDraft.pid,
      label: branchDraft.label, title: branchDraft.title });
    branchDraft = null;
    await reloadView();
    err = "";
  } catch (e) {
    err = e.message;
  }
  render();
}

async function reshape(body) {
  if (job) return;
  try {
    await api("POST", "/api/facile/reshape", body);
    await reloadView();
    err = "";
  } catch (e) {
    err = e.message;
  }
  render();
}

const detachRoute = (sid) => reshape({ action: "detach", scene: sid });
const rejoinScene = (sid, target) => { if (target) reshape({ action: "rejoin", scene: sid, target }); };
const attachBlock = (bid) => reshape({ action: "attach", block: bid,
  scene: $("rs-" + bid).value, label: $("rl-" + bid).value.trim() });

function bodyPlans() {
  const busy = job || V.busy;
  const missing = V.scenes.reduce((n, s) => n + s.plans.filter((p) => !p.image).length, 0);
  const select = `<label class="inline">Plans proposés par l'IA
    <select onchange="setMaxPlans(this.value)" ${busy ? "disabled" : ""}>
      ${V.plan_limits.map((n) => `<option value="${n}" ${n === V.max_plans ? "selected" : ""}>${n || "Autant que je veux"}</option>`).join("")}
    </select></label>`;
  const lanes = routeLanes().map((row) => laneHtml(row, busy)).join("");
  return {
    body: `<div class="planbar">${select}</div>
      <p class="hint">Cliquez une image pour l'ouvrir. Le « ＋ » entre deux images crée une bifurcation : la suite devient une route.</p>
      <div class="lanes">${lanes || `<p class="notice">Pas encore de scènes.</p>`}</div>
      ${reserveHtml(busy)}
      ${overlayHtml(busy)}`,
    foot: `<div class="actions">
      <button class="ghost" onclick="prev()" ${busy ? "disabled" : ""}>Retour</button>
      <div class="right">${missing ? `<button class="ghost" onclick="allPlanImages()" ${busy ? "disabled" : ""}>Créer toutes les images (${missing})</button>` : ""}
      <button class="primary" onclick="next()" ${busy || !V.done.images ? "disabled" : ""}>Continuer</button></div></div>`,
  };
}

// --- étape Jouer ---
async function buildGame() {
  err = "";
  gameResult = null;
  job = { id: "export", message: "Fabrication du jeu et vérification (quelques secondes)…" };
  render();
  try {
    gameResult = await api("POST", "/api/facile/export", {});
  } catch (e) { err = e.message; }
  job = null;
  render();
}

async function launchGame() {
  try { await api("POST", "/api/facile/launch", {}); } catch (e) { err = e.message; render(); }
}

function bodyJouer() {
  const busy = job || V.busy;
  const r = gameResult;
  if (V.kids) {
    const plans = V.scenes.reduce((n, s) => n + s.plans.length, 0);
    return {
      body: `<p class="notice">${V.chapters.length} chapitre(s) · ${V.scenes.length} scène(s) · ${plans} image(s)</p>
        <div class="play-cta"><a class="primary big" href="/jouer">▶ Lire mon histoire</a></div>
        <p class="hint">Cliquez ou appuyez pour avancer. Une fois lue, l'histoire reste sur cet appareil.</p>`,
      foot: `<div class="actions"><button class="link" onclick="reset()" ${busy ? "disabled" : ""}>Recommencer une autre histoire</button><span></span></div>`,
    };
  }
  let report = "";
  if (r) {
    const ok = r.lint.ok;
    report = `<div class="report">
      <p class="${ok ? "okmark" : "warn"}">${ok ? "Le jeu est prêt." : "Ren'Py signale des erreurs : à corriger avant de lancer."}</p>
      <p class="notice">${r.export.images} image(s) ajoutée(s) au jeu.</p>
      ${r.warnings.length ? `<p>À vérifier :</p><ul>${r.warnings.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
      ${ok ? "" : `<ul>${r.lint.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>`}
    </div>`;
  }
  const plans = V.scenes.reduce((n, s) => n + s.plans.length, 0);
  return {
    body: `<p class="notice">Histoire : ${V.scenes.length} scène(s) · ${plans} plan(s) · ${V.characters.length} personnage(s) · ${V.locations.length} lieu(x) · ${V.outfits.length} tenue(s)</p>${report}`,
    foot: `<div class="actions">
      <button class="link" onclick="reset()" ${busy ? "disabled" : ""}>Recommencer une autre histoire</button>
      <div class="right">
        <button class="ghost" onclick="buildGame()" ${busy ? "disabled" : ""}>Créer le jeu</button>
        <button class="primary" onclick="launchGame()" ${busy || !(r && r.lint.ok) ? "disabled" : ""}>Lancer le jeu</button>
      </div></div>`,
  };
}

// --- affichage ---
function render() {
  if (!V) return;
  renderSteps();
  if (catalogOpen) {
    $("stage").innerHTML = catalogHtml();
    return;
  }
  const s = STEPS.find((x) => x.id === step);
  const i = stepIndex(step);
  const parts = {
    style: () => bodyStyle(),
    idee: () => bodyIdee(),
    carte: () => bodyCarte(),
    personnages: () => bodyCards("characters", "p2", "personnage"),
    lieux: () => bodyCards("locations", "p169", "lieu"),
    tenues: () => bodyCards("outfits", "p2", "tenue"),
    histoire: () => bodyHistoire(),
    images: () => bodyPlans(),
    jouer: () => bodyJouer(),
  }[step]();
  const errBox = err ? `<div class="errbox toast" onclick="err = ''; render()" title="Cliquer pour fermer">${esc(err)}</div>` : "";
  // Les blocs repliables gardent leur état (ouvert ou fermé) quand la page se redessine.
  const opened = new Set([...document.querySelectorAll("details[data-key][open]")].map((d) => d.dataset.key));
  $("stage").innerHTML = `
    <p class="kicker">Étape ${i + 1} sur ${stepList().length}</p>
    <h1>${esc(s.title)}</h1>
    <p class="lead">${esc(s.lead)}</p>
    <div id="jobslot">${jobHtml()}</div>${errBox}${settingsForm ? settingsHtml() : ""}${chapterBar()}${pendingHtml()}${parts.body}${parts.foot}`;
  for (const d of document.querySelectorAll("details[data-key]")) {
    if (opened.has(d.dataset.key)) d.open = true;
  }
  if (V.character_mode === "designer" && step === "personnages" && !job && !V.busy) {
    const it = currentCard();
    if (it && it.aid && !prefillTried[it.aid] && (!it.description || !genderOk(it.descriptor))) prefillIdentity(it.aid);
  }
  const key = CARD_KEYS[step];
  if (key && !job && !V.busy) {
    // Éléments jamais créés (histoire écrite avant cette étape) : on les crée une fois, sans boucle.
    if (V[key].some((c) => !c.aid) && !autoTried["complete:" + key]) {
      autoTried["complete:" + key] = true;
      completeStory();
    } else {
      maybeAutoDraw();
    }
  }
}

// Visionneuse : un clic agrandit une image, un clic sur l'agrandissement la referme.
document.addEventListener("click", (ev) => {
  const box = document.querySelector(".lightbox");
  if (box) { box.remove(); return; }
  const img = ev.target.closest && ev.target.closest("img.zoomable");
  if (!img) return;
  const big = document.createElement("div");
  big.className = "lightbox";
  big.innerHTML = `<img src="${img.src}" alt="${esc(img.alt || "")}">`;
  document.body.appendChild(big);
});

window.addEventListener("load", async () => {
  try {
    await load();
    render();
    // Depuis « Mes histoires » : on configure les modèles et moteurs avant toute création.
    if (new URLSearchParams(location.search).has("reglages")) toggleSettings();
    if (V.kids) {
      const d = await api("GET", "/api/facile/settings");
      if (!d.replicate_key) toggleSettings();
    }
  } catch (e) {
    $("stage").innerHTML = `<div class="errbox">Le serveur ne répond pas : ${esc(e.message)}</div>`;
  }
});
</script>
</body>
</html>
