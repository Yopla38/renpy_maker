    const out = await api("POST", "/api/atelier/characters/propose", { idea: [V.idea, V.recit.ambiance].filter(Boolean).join(" — Ambiance : "),
      existing: V.characters.map((c) => c.name), count: 3 });
    castProposal = out.characters;
  } catch (e) { setMsg(e.message); }
  thinking = false; render();
}

function acceptCharacter(i) {
  const c = castProposal[i];
  const description = document.getElementById(`cp-desc-${i}`).value;
  const descriptor = document.getElementById(`cp-genre-${i}`).value;
  act(async () => {
    await api("POST", "/api/atelier/characters/add", { name: c.name, description, descriptor });
    castProposal.splice(i, 1);
    if (!castProposal.length) castProposal = null;
  }, `${c.name} rejoint l'histoire.`);
}

function addManual() {
  const name = document.getElementById("m-name").value.trim();
  if (!name) { setMsg("Donnez un nom au personnage."); return render(); }
  const description = document.getElementById("m-desc").value;
  const descriptor = document.getElementById("m-genre").value;
  act(() => api("POST", "/api/atelier/characters/add", { name, description, descriptor }), `${name} rejoint l'histoire.`);
}

function startStory() { starting = true; failed = null; P = null; setMsg(""); render(); autoPropose(); }
function editFrame() { V.idea = ""; frameDraft = { title: V.title || "", idea: "", ambiance: V.recit.ambiance || "", style: V.style ? V.style.key : "" }; load(); }

// --- Fenêtres --------------------------------------------------------------------------------------------------------
function openOverlay(name) { overlay = name; mapSel = null; joinFrom = null; joinTarget = null; if (name === "frame") frameDraft = null; load(); }
function closeOverlay() { overlay = null; settings = null; joinFrom = null; joinTarget = null; if (cy) { cy.destroy(); cy = null; } render(); autoPropose(); }

function renderOverlay() {
  const root = document.getElementById("overlay-root");
  if (!overlay) { root.innerHTML = ""; return; }
  if (overlay === "settings") { root.innerHTML = settings ? settingsHtml() : ""; return; }
  if (overlay === "map") {
    root.innerHTML = `<div class="overlay" onclick="if (event.target === this) closeOverlay()">
      <div class="window map" role="dialog" aria-label="Lignes de vie">
        <div class="window-head"><h2>Lignes de vie</h2><button class="btn quiet" onclick="closeOverlay()">Fermer</button></div>
        <div class="map-grid"><div id="lifemap"></div><aside class="map-side" id="map-side">${mapSideHtml()}</aside></div></div></div>`;
    setTimeout(mountMap, 0);
    return;
  }
  const title = overlay === "cast" ? "Les personnages" : "Le cadre";
  root.innerHTML = `<div class="overlay" onclick="if (event.target === this) closeOverlay()">
    <div class="window" role="dialog" aria-label="${title}">
      <div class="window-head"><h2>${title}</h2><button class="btn quiet" onclick="closeOverlay()">Fermer</button></div>
      <div class="window-body">${msgHtml()}${overlay === "cast" ? castHtml(true) : frameHtml(true)}</div></div></div>`;
}

// --- La carte des lignes de vie ----------------------------------------------------------------------------------------
function firstImage(sid) {
  const s = scard(sid);
  return s ? (sortedPlans(s).map((p) => p.image).find(Boolean) || "") : "";
}

function mountMap() {
  const box = document.getElementById("lifemap");
  if (!box || !window.cytoscape) return;
  const g = V.recit.graph;
  const lived = new Set((V.recit.path || []).map((x) => x.scene));
  const ids = new Set(g.nodes.map((n) => n.id));
  const elements = g.nodes.map((n) => {
    const r = rs(n.id) || {};
    const title = n.title.length > 26 ? n.title.slice(0, 25) + "…" : n.title;
    const cls = [r.open ? "open" : "", n.ending ? "ending" : "", n.id === cur() ? "current" : "", n.reachable ? "" : "lost",
      lived.has(n.id) ? "lived" : "", n.id === mapSel ? "sel" : ""].filter(Boolean).join(" ");
    return { data: { id: n.id, label: title || n.id, img: firstImage(n.id) }, classes: cls };
  });
  g.edges.forEach((e, i) => { if (ids.has(e.target)) elements.push({ data: { id: `e${i}`, source: e.source, target: e.target, label: e.label || "" }, classes: e.kind }); });
  if (cy) cy.destroy();
  cy = cytoscape({
    container: box, elements, autoungrabify: true,
    layout: { name: "breadthfirst", directed: true, roots: g.start ? [g.start] : undefined, spacingFactor: 1.1, animate: false },
    style: [
      { selector: "node", style: { shape: "round-rectangle", width: 132, height: 74, "background-color": "#252B3B", "background-fit": "cover",
        "border-width": 2, "border-color": "#A9B0C2", label: "data(label)", color: "#F2EDE3", "font-size": 13, "font-family": "Hanken Grotesk, sans-serif",
        "text-valign": "bottom", "text-margin-y": 8, "text-wrap": "ellipsis", "text-max-width": 150 } },
      { selector: 'node[img != ""]', style: { "background-image": "data(img)" } },
      { selector: "node.lived", style: { "border-color": "#F2EDE3" } },
      { selector: "node.open", style: { "border-color": "#E0A526", "border-style": "dashed", "border-width": 4 } },
      { selector: "node.ending", style: { "border-style": "double", "border-width": 6, "border-color": "#F2EDE3" } },
      { selector: "node.current", style: { "underlay-color": "#E0A526", "underlay-opacity": 0.45, "underlay-padding": 9, "underlay-shape": "round-rectangle" } },
      { selector: "node.lost", style: { opacity: 0.4 } },
      { selector: "node.sel", style: { "border-color": "#D9512C", "border-width": 5, "border-style": "solid" } },
      { selector: "edge", style: { width: 2, "line-color": "#A9B0C2", "target-arrow-color": "#A9B0C2", "target-arrow-shape": "triangle", "curve-style": "bezier", "arrow-scale": 0.9 } },
      { selector: "edge.choice", style: { "line-color": "#D9512C", "target-arrow-color": "#D9512C", label: "data(label)", "font-size": 12, color: "#F2EDE3",
        "text-background-color": "#1A1E2A", "text-background-opacity": 1, "text-background-padding": 3, "text-wrap": "ellipsis", "text-max-width": 160 } },
    ],
  });
  // Le temps va de gauche à droite : la mise en page verticale est tournée d'un quart de tour.
  cy.nodes().positions((n) => ({ x: n.position("y") * 1.7, y: n.position("x") * 0.85 }));
  cy.fit(undefined, 40);
  cy.on("tap", "node", (ev) => mapTap(ev.target.id()));
}

function mapTap(id) {
  if (joinFrom && !joinTarget) {
    if (id === joinFrom) return;
    joinTarget = id;
  } else if (!joinFrom) {
    mapSel = id;
  }
  if (cy) { cy.nodes().removeClass("sel"); cy.getElementById(joinTarget || mapSel).addClass("sel"); }
  document.getElementById("map-side").innerHTML = mapSideHtml();
}

function titleOf(sid) { const s = scard(sid); return s ? s.title : sid; }

function mapSideHtml() {
  if (joinFrom) {
    if (!joinTarget) return `<h3>Rassembler deux lignes</h3><p>Touchez sur la carte la scène où « ${esc(titleOf(joinFrom))} » rejoint une autre ligne.</p>
      <div class="stack"><button class="btn quiet" onclick="cancelJoin()">Annuler</button></div>`;
    const s = scard(joinTarget);
    const moments = sortedPlans(s).map((p) => {
      const line = s.dialogue[p.from_line];
      return `<button class="ref" onclick="doJoin(${p.from_line})" title="${esc(line ? line.text : "")}">${p.image ? `<img src="${esc(p.image)}" alt="">` : `<span class="none">sans image</span>`}
        <span>${p.from_line === 0 ? "Au début" : esc(line ? line.text : "")}</span></button>`;
    }).join("");
    return `<h3>Rejoindre « ${esc(s.title)} »</h3><p class="note">À quel moment la ligne arrive-t-elle ? La suite sera commune aux deux lignes.</p>
      <div class="moments">${moments || `<button class="btn" onclick="doJoin(0)">Au début</button>`}</div>
      <div class="stack"><button class="btn quiet" onclick="joinTarget=null; mapTap(joinFrom)">Choisir une autre scène</button><button class="btn quiet" onclick="cancelJoin()">Annuler</button></div>`;
  }
  if (mapSel) {
    const s = scard(mapSel);
    const r = rs(mapSel) || {};
    if (!s) return "";
    const state = r.open ? "Ligne ouverte : elle attend sa suite." : r.ending ? "Une fin de l'histoire." : r.choices.length ? "Un choix." : r.next ? `Continue vers « ${esc(titleOf(r.next))} ».` : "";
    const actions = [];
    if (r.open) actions.push(`<button class="btn primary" onclick="liveHere('${esc(s.id)}', false)">${s.id === cur() ? "Continuer cette ligne" : "Vivre cette ligne"}</button>`);
    else if (r.next || r.choices.length) actions.push(`<button class="btn" onclick="liveHere('${esc(s.id)}', true)">Aller jusqu'au prochain choix</button>`);
    if (r.open && r.return_to && scard(r.return_to) && s.dialogue.length) actions.push(`<button class="btn" onclick="joinNow('${esc(s.id)}', '${esc(r.return_to)}')">Revenir au fil : « ${esc(titleOf(r.return_to))} »</button>`);
    if (r.open && s.dialogue.length) actions.push(`<button class="btn" onclick="startJoin('${esc(s.id)}')">Rejoindre une autre ligne…</button>`);
    if (r.open && s.dialogue.length) actions.push(`<button class="btn quiet" onclick="mapAct('finish', '${esc(s.id)}')">Terminer ici (une fin)</button>`);
    if (r.ending || (r.next && !r.choices.length && V.recit.graph.edges.some((e) => e.source === s.id && e.kind === "next") && r.next !== nextInOrder(s.id)))
      actions.push(`<button class="btn quiet" onclick="mapAct('reopen', '${esc(s.id)}')">Rouvrir cette ligne</button>`);
    const choices = r.choices.map((c) => `<label class="field" style="margin-top:8px">Vers « ${esc(titleOf(c.target))} »
        <input type="text" maxlength="60" value="${esc(c.label)}" data-target="${esc(c.target)}" onchange="renameChoice('${esc(s.id)}', this.dataset.target, this.value)"></label>`).join("");
    return `<p class="note" style="margin:0">${esc(s.location || "")}</p><h3>${esc(s.title)}</h3>
      <p class="note">${s.dialogue.length} réplique${s.dialogue.length > 1 ? "s" : ""}. ${state}</p>
      <div class="stack">${actions.join("")}</div>
      ${choices ? `<h4>Libellés des choix</h4>${choices}` : ""}
      <div class="stack"><button class="lnk" onclick="mapSel=null; mapTap(null)">Retour à la vue d'ensemble</button></div>`;
  }
  const opens = Object.entries(V.recit.scenes).filter(([, r]) => r.open).map(([id]) => id);
  return `<h3>Vos lignes</h3>
    <p class="note">Chaque choix ouvre des lignes ; une ligne peut en rejoindre une autre. Touchez une scène pour agir.</p>
    ${opens.length ? `<h4>À vivre</h4><div class="stack">${opens.map((id) => `<button class="btn ${id === cur() ? "primary" : ""}" onclick="liveHere('${esc(id)}', false)">${esc(titleOf(id))}${id === cur() ? " (en cours)" : ""}</button>`).join("")}</div>` : `<p>Aucune ligne ouverte.</p>`}
    <div class="stack"><button class="btn quiet" onclick="closeOverlay(); startReplay()">Rejouer depuis le début</button></div>
    <div class="legend"><span><i style="border-color:#E0A526;border-style:dashed"></i>Ligne qui attend sa suite</span>
      <span><i style="border-style:double;border-width:4px"></i>Une fin</span>
      <span><i style="background:#D9512C;border-color:#D9512C;height:4px"></i>Un choix</span>
      <span><i style="background:#E0A526;opacity:.6"></i>Là où vous êtes</span></div>`;
}

function nextInOrder(sid) {
  const ids = V.scenes.map((s) => s.id);
  const i = ids.indexOf(sid);
  return i >= 0 && i + 1 < ids.length ? ids[i + 1] : null;
}

function liveHere(sid, follow) {
  act(async () => {
    await api("POST", "/api/recit/current", { scene: sid, follow });
    overlay = null; P = null; pendingChoices = null; souvenir = null; failed = null;
    if (cy) { cy.destroy(); cy = null; }
  });
}
function startJoin(sid) { joinFrom = sid; joinTarget = null; mapSel = null; document.getElementById("map-side").innerHTML = mapSideHtml(); }
function cancelJoin() { joinFrom = null; joinTarget = null; if (cy) cy.nodes().removeClass("sel"); document.getElementById("map-side").innerHTML = mapSideHtml(); }
function doJoin(line) { joinNow(joinFrom, joinTarget, line); }
function joinNow(sid, target, line = 0) {
  act(async () => {
    await api("POST", "/api/recit/rejoin", { scene: sid, target, line });
    joinFrom = null; joinTarget = null; mapSel = null; P = null; pendingChoices = null;
  }, "Les deux lignes se rejoignent.");
}
function mapAct(kind, sid) {
  act(async () => { await api("POST", `/api/recit/${kind}`, { scene: sid }); P = null; mapSel = sid; },
    kind === "finish" ? "Cette ligne se termine ici." : "La ligne attend de nouveau sa suite.");
}
function renameChoice(sid, target, label) { act(() => api("POST", "/api/recit/label", { scene: sid, target, label }), "Libellé enregistré."); }

// --- Rejouer : lire une ligne comme le jeu, en choisissant aux carrefours ------------------------------------------
function startReplay() {
  if (!V.recit.graph.start) return;
  replay = { sid: V.recit.graph.start, i: 0, img: null };
  souvenir = null; drawerOpen = false;
  render();
}
function stopReplay() { replay = null; render(); autoPropose(); }

function replayImage() {
  const s = scard(replay.sid);
  let img = replay.img;
  for (const p of sortedPlans(s)) if (p.from_line <= replay.i && p.image) img = p.image;
  return img;
}

function replayNext() {
  const s = scard(replay.sid);
  if (replay.i < s.dialogue.length) { replay.i++; return render(); }
  const r = rs(replay.sid) || {};
  if (!r.choices.length && r.next && !r.ending) { replay = { sid: r.next, i: 0, img: replayImage() }; render(); }
}
function replayGo(target) { replay = { sid: target, i: 0, img: replayImage() }; render(); }
function replayLive(sid) { replay = null; liveHere(sid, false); }

function replayHtml() {
  const s = scard(replay.sid);
  const r = rs(replay.sid) || {};
  const line = s.dialogue[replay.i];
  const img = replayImage();
  let layer = "";
  if (line && line.speaker === NARR) layer = `<div class="recitatif">${esc(line.text)}</div>`;
  else if (line) layer = `<div class="bubble"><span class="nameplate"><span>${esc(line.speaker)}</span></span><div style="font-size:19px">${esc(line.text)}</div></div>`;
  else if (r.choices.length) layer = `<div class="menu" onclick="event.stopPropagation()"><h2>Que faire ?</h2>${r.choices.map((c, i) => `<button class="opt" onclick="replayGo('${esc(c.target)}')"><span class="key">${i + 1}</span>${esc(c.label)}</button>`).join("")}</div>`;
  else if (r.ending) layer = `<div class="card-center" onclick="event.stopPropagation()"><h2>Fin</h2><div class="row"><button class="btn primary" onclick="startReplay()">Rejouer</button><button class="btn quiet" onclick="stopReplay()">Revenir au récit</button></div></div>`;
  else if (r.open) layer = `<div class="card-center" onclick="event.stopPropagation()"><h2>${s.dialogue.length ? "À suivre…" : "Une ligne pas encore vécue"}</h2>
      <p>${s.dialogue.length ? "Cette ligne attend sa suite." : "Ce choix n'a pas encore d'histoire."}</p>
      <div class="row"><button class="btn primary" onclick="replayLive('${esc(s.id)}')">La vivre maintenant</button><button class="btn quiet" onclick="stopReplay()">Revenir au récit</button></div></div>`;
  return `<div class="theatre"><div class="stage" onclick="replayNext()" style="cursor:pointer">
      ${img ? `<img class="bg" src="${esc(img)}" alt="" style="cursor:pointer">` : `<div class="bg-empty"><span class="place">${esc(s.location || s.title)}</span></div>`}${layer}</div>
    <div class="subactions"><span class="note" style="color:var(--mist)">Cliquez ou appuyez sur Entrée pour avancer.</span><button class="lnk" onclick="stopReplay()">Revenir au récit</button></div></div>`;
}

// --- Réglages des modèles (mêmes appels que l'atelier) ---------------------------------------------------------------
async function openSettings() {
  try {
    settings = await api("GET", "/api/facile/settings");
    overlay = "settings";
    drawerOpen = false;
    render();
  } catch (e) { setMsg(e.message); render(); }
}

function settingsHtml() {
  const t = settings.text;
  const provider = t.choices.find((c) => c.name === t.provider) || t.choices[0];
  const engines = { replicate: "Replicate (cloud)", comfyui: "ComfyUI (local)" };
  const images = settings.image_rows.map((r, i) => `<div class="setrow">
      <label class="field" style="margin:0">${esc(r.label)}<select id="img-engine-${i}">${Object.entries(engines).map(([k, v]) => `<option value="${k}" ${r.engine === k ? "selected" : ""}>${v}</option>`).join("")}</select></label>
      <label class="field" style="margin:0">Workflow ComfyUI<select id="img-wf-${i}">${r.choices.map((w) => `<option ${w === r.workflow ? "selected" : ""}>${esc(w)}</option>`).join("")}</select></label></div>`).join("");
  return `<div class="overlay" onclick="if (event.target === this) closeOverlay()">
    <div class="window" role="dialog" aria-label="Modèles et moteurs" style="width:min(680px,100%)">
      <div class="window-head"><h2>Modèles et moteurs</h2><button class="btn quiet" onclick="closeOverlay()">Fermer</button></div>
      <div class="window-body"><section class="sheet-body">
        <h3 style="font:400 22px var(--serif);margin:0">Écriture</h3>
        <p class="note">Le fournisseur et le modèle qui écrivent le récit.</p>
        <div class="setrow"><label class="field" style="margin:0">Fournisseur<select id="st-provider" onchange="settingsProviderChanged(this.value)">${t.choices.map((c) => `<option value="${esc(c.name)}" ${c.name === t.provider ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select></label>
          <label class="field" style="margin:0">Modèle<input type="text" id="st-model" value="${esc(provider.model)}"></label></div>
        <p class="note">${provider.key ? "Clé enregistrée." : "Aucune clé enregistrée pour ce fournisseur."}</p>
        <h3 style="font:400 22px var(--serif);margin:18px 0 0">Images</h3>
        <p class="note">Le moteur qui dessine chaque image : Replicate (cloud) ou ComfyUI (sur cette machine).</p>${images}
        <h3 style="font:400 22px var(--serif);margin:18px 0 0">Clé Replicate</h3>
        <p class="note">${settings.replicate_key ? "Clé enregistrée sur cet appareil. Elle n'est jamais affichée." : "Aucune clé enregistrée."}</p>
        <div class="setrow"><input type="text" id="st-key" placeholder="Collez votre clé Replicate" autocomplete="off"><button class="btn" onclick="saveKey()">Enregistrer la clé</button></div>
        <div class="row"><button class="btn primary" onclick="saveSettings()">Enregistrer les réglages</button></div>
      </section></div></div></div>`;
}

function settingsProviderChanged(name) {
  const c = settings.text.choices.find((x) => x.name === name);
  if (c) document.getElementById("st-model").value = c.model;
}

async function saveSettings() {
  const body = {
    text_provider: document.getElementById("st-provider").value,
    text_model: document.getElementById("st-model").value,
    tasks: settings.tasks.map((r) => ({ task: r.task, provider: r.provider, model: r.model })),
    images: settings.image_rows.map((r, i) => ({ role: r.role, engine: document.getElementById(`img-engine-${i}`).value,
      workflow: document.getElementById(`img-wf-${i}`).value, steps: r.steps })),
  };
  try {
    await api("POST", "/api/facile/settings", body);
    closeOverlay();
    setMsg("Réglages enregistrés.", true);
    await load();
  } catch (e) { setMsg(e.message); render(); }
}

async function saveKey() {
  const value = document.getElementById("st-key").value.trim();
  if (!value) return;
  try {
    await api("POST", "/api/facile/secret", { name: "REPLICATE_API_TOKEN", value });
    closeOverlay();
    setMsg("Clé enregistrée sur cet appareil.", true);
    await load();
  } catch (e) { setMsg(e.message); render(); }
}

// --- Visionneuse et clavier ------------------------------------------------------------------------------------------
function openLightbox(src, caption) {
  closeLightbox();
  const box = document.createElement("div");
  box.id = "lightbox";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", caption || "Image");
  box.innerHTML = `<img src="${esc(src)}" alt="${esc(caption)}">`;
  box.addEventListener("click", closeLightbox);
  document.body.appendChild(box);
}
function closeLightbox() { const box = document.getElementById("lightbox"); if (box) box.remove(); }

document.addEventListener("click", (ev) => {
  const img = ev.target.closest && ev.target.closest("img[data-zoom]");
  if (!img) return;
  ev.preventDefault();
  ev.stopPropagation();
  openLightbox(img.src, img.alt || "");
}, true);

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") {
    if (document.getElementById("lightbox")) return closeLightbox();
    if (listening && rec) return rec.abort();
    if (overlay) return closeOverlay();
    if (drawerOpen) return closeDrawer();
    if (replay) return stopReplay();
    if (souvenir) return closeSouvenir();
    return;
  }
  if (ev.target.closest && ev.target.closest("input, textarea, select")) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey || !V || overlay || drawerOpen) return;
  if (replay) {
    if (["Enter", " ", "ArrowRight"].includes(ev.key)) { ev.preventDefault(); replayNext(); }
    const s = scard(replay.sid);
    const opts = (rs(replay.sid) || { choices: [] }).choices;
    const k = Number(ev.key) - 1;
    if (/^[1-4]$/.test(ev.key) && s && replay.i >= s.dialogue.length && k < opts.length) { ev.preventDefault(); replayGo(opts[k].target); }
    return;
  }
  if (phase() !== "stage") return;
  if (/^[1-4]$/.test(ev.key)) {
    const k = Number(ev.key) - 1;
    const r = cur() ? rs(cur()) : null;
    if (pendingChoices && k < pendingChoices.options.length) { ev.preventDefault(); return pickChoice(k); }
    if (r && !r.open && k < r.choices.length) { ev.preventDefault(); return pickExisting(r.choices[k].target); }
  }
  if ((ev.key === "Enter" || ev.key === "ArrowRight") && P && !souvenir && !pendingChoices) { ev.preventDefault(); return continueMoment(); }
  if (ev.key.toLowerCase() === "m" && SR) { ev.preventDefault(); return toggleMic(); }
});

load().catch((e) => { document.getElementById("main").innerHTML = `<p class="msg">${esc(e.message)}</p>`; });
</script>
