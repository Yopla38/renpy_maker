<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;800&display=swap" rel="stylesheet">
<style>
:root { --ink: #f6f1e7; --box: rgba(16, 13, 20, .84); --gold: #f2b36b; }
html, body { margin: 0; height: 100%; background: #0d0b10; color: var(--ink); overflow: hidden; user-select: none; -webkit-user-select: none; }
body { font: 400 18px/1.5 Nunito, system-ui, sans-serif; }
#stage { position: fixed; inset: 0; cursor: pointer; }
.bg { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 1.1s ease; }
.bg.on { opacity: 1; }
#shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.45), transparent 28%, transparent 50%, rgba(0,0,0,.35)); }
#title { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
  font: 700 clamp(26px, 6vw, 46px)/1.2 Fraunces, Georgia, serif; text-shadow: 0 2px 18px #000;
  opacity: 0; transition: opacity .8s ease; pointer-events: none; }
#title.on { opacity: 1; }
#title small { display: block; font: 800 14px Nunito, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
#top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
  gap: 8px; padding: 12px 14px; z-index: 6; }
#top .name { font: 700 16px Fraunces, Georgia, serif; text-shadow: 0 1px 8px #000; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btns { display: flex; gap: 8px; flex: none; }
.btn { background: rgba(16,13,20,.7); color: var(--ink); border: 1px solid rgba(242,179,107,.5); border-radius: 10px;
  padding: 7px 12px; font: 800 14px Nunito, sans-serif; cursor: pointer; text-decoration: none; }
.btn.on { background: var(--gold); color: #1d1610; }
#box { position: absolute; left: 0; right: 0; bottom: 0; height: auto; max-height: 46%; min-height: 180px; box-sizing: border-box;
  padding: 22px clamp(16px, 7vw, 90px) 30px; background: var(--box); border-top: 2px solid rgba(242,179,107,.55);
  backdrop-filter: blur(4px); z-index: 4; }
#name { display: none; position: absolute; left: clamp(16px, 7vw, 90px); top: -34px; padding: 6px 16px; border-radius: 10px 10px 0 0;
  font: 800 18px Nunito, sans-serif; color: #17120c; background: var(--c, var(--gold)); }
#name.on { display: block; }
#text { font-size: clamp(17px, 2.5vw, 21px); line-height: 1.55; white-space: pre-wrap; max-height: calc(46vh - 40px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding-right: 6px; }
#text.narr { font-style: italic; color: #e7dccb; }
#more { position: absolute; right: 22px; bottom: 14px; color: var(--gold); font-size: 20px; animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
#end { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; background: rgba(8,6,10,.7); z-index: 8; }
#end.on { display: grid; }
#end h2 { font: 700 clamp(26px, 6vw, 40px) Fraunces, Georgia, serif; margin: 0 0 18px; }
#end .btns { justify-content: center; flex-wrap: wrap; }
#end .btn { padding: 12px 20px; font-size: 16px; }
#empty { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
#empty.on { display: grid; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div id="shade"></div>
  <div id="title"><div></div></div>
  <div id="box">
    <div id="name"></div>
    <div id="text"></div>
    <div id="more">▼</div>
  </div>
  <div id="end">
    <div>
      <h2>Fin de l'histoire</h2>
      <div class="btns">
        <button class="btn" id="again">Revoir depuis le début</button>
        <a class="btn" href="/facile">Retour à l'éditeur</a>
      </div>
    </div>
  </div>
  <div id="empty">
    <div>
      <p>Il n'y a pas encore de scène à lire.</p>
      <a class="btn" href="/facile">Retour à l'éditeur</a>
    </div>
  </div>
</div>
<div id="top">
  <div class="name" id="book">Lecture</div>
  <div class="btns">
    <button class="btn" id="autoBtn">Auto</button>
    <button class="btn" id="backBtn" title="Réplique précédente">◀</button>
    <a class="btn" href="/facile">Éditeur</a>
  </div>
</div>

<script>
const SAVE_KEY = "histoire-lecture";
let story = null;     // {title, scenes: [{id, title, chapter, lines, images}]}
let si = 0;           // scène courante
let li = 0;           // réplique courante
let auto = false;
let typing = null;    // {full, shown, timer} pendant l'écriture lettre par lettre
let autoTimer = null;
let lastLen = 0;      // longueur de la réplique affichée : en mode auto, on laisse le temps de la lire
let shownBg = null;
let bgFront = "bgA";

const $ = (id) => document.getElementById(id);
const nameColor = (name) => {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h}, 70%, 72%)`;
};

function saveProgress() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ si, li })); } catch (e) { /* navigation privée : rien à faire */ }
}

function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (p && story.scenes[p.si]) { si = p.si; li = Math.min(p.li, story.scenes[p.si].lines.length - 1); }
  } catch (e) { /* pas de sauvegarde lisible */ }
}

function setBackground(url) {
  if (!url || url === shownBg) return;
  shownBg = url;
  const next = bgFront === "bgA" ? "bgB" : "bgA";
  $(next).style.backgroundImage = `url("${url}")`;
  $(next).classList.add("on");
  $(bgFront).classList.remove("on");
  bgFront = next;
}

function imageFor(scene, line) {
  let found = null;
  for (const im of scene.images) if (im.from_line <= line) found = im.image;
  return found || (scene.images[0] && scene.images[0].image) || null;
}

function showTitle(text, sub) {
  const t = $("title");
  t.firstElementChild.innerHTML = `<small>${sub}</small>${text}`;
  t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 1900);
}

function typeText(full, narr) {
  const el = $("text");
  lastLen = full.length;
  el.className = narr ? "narr" : "";
  stopTyping();
  typing = { full, shown: 0 };
  typing.timer = setInterval(() => {
    typing.shown = Math.min(full.length, typing.shown + 2);
    el.textContent = full.slice(0, typing.shown);
    if (typing.shown >= full.length) finishTyping();
  }, 18);
}

// Arrête l'écriture sans rien afficher (on passe à une autre réplique).
function stopTyping() {
  if (!typing) return;
  clearInterval(typing.timer);
  typing = null;
}

// Affiche tout le texte en cours, puis reprend la lecture automatique si elle est active.
function finishTyping() {
  if (!typing) return;
  clearInterval(typing.timer);
  $("text").textContent = typing.full;
  typing = null;
  if (auto) scheduleNext();
}

function scheduleNext() {
  clearTimeout(autoTimer);
  if (auto) autoTimer = setTimeout(advance, Math.max(2600, lastLen * 60));
}

function showLine() {
  const scene = story.scenes[si];
  const line = scene.lines[li];
  saveProgress();
  setBackground(imageFor(scene, li));
  if (line && line.pause) {  // image seule : rien à lire, elle attend un clic (même en mode auto)
    stopTyping();
    clearTimeout(autoTimer);
    $("name").classList.remove("on");
    $("text").textContent = "";
    return;
  }
  const narr = !line || line.speaker === "Narration";
  const name = $("name");
  if (narr) {
    name.classList.remove("on");
  } else {
    name.textContent = line.speaker;
    name.style.setProperty("--c", nameColor(line.speaker));
    name.classList.add("on");
  }
  typeText(line ? line.text : "", narr);
}

function startScene(index) {
  si = index;
  li = 0;
  const scene = story.scenes[si];
  showTitle(scene.title, scene.chapter);
  setBackground(imageFor(scene, 0));
  showLine();
}

function end() {
  clearTimeout(autoTimer);
  $("end").classList.add("on");
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* rien */ }
}

// Avance d'une réplique. Pendant l'écriture, un clic affiche tout le texte d'abord.
function advance() {
  if (!story || !story.scenes.length || $("end").classList.contains("on")) return;
  if (typing) return finishTyping();
  const scene = story.scenes[si];
  if (li < scene.lines.length - 1) { li++; return showLine(); }
  if (si < story.scenes.length - 1) return startScene(si + 1);
  end();
}

function back() {
  if (!story) return;
  clearTimeout(autoTimer);
  $("end").classList.remove("on");
  if (li > 0) { li--; return showLine(); }
  if (si > 0) { si--; li = story.scenes[si].lines.length - 1; return showLine(); }
}

function toggleAuto() {
  auto = !auto;
  $("autoBtn").classList.toggle("on", auto);
  if (auto && !typing) scheduleNext();
  if (!auto) clearTimeout(autoTimer);
}

// Faire défiler une réplique longue ne doit pas passer à la suivante.
$("text").addEventListener("click", (ev) => ev.stopPropagation());
$("stage").addEventListener("click", (ev) => {
  if (ev.target.closest("a, button")) return;
  advance();
});
$("autoBtn").addEventListener("click", (ev) => { ev.stopPropagation(); toggleAuto(); });
$("backBtn").addEventListener("click", (ev) => { ev.stopPropagation(); back(); });
$("again").addEventListener("click", (ev) => { ev.stopPropagation(); $("end").classList.remove("on"); startScene(0); });
document.addEventListener("keydown", (ev) => {
  if (["Space", "Enter", "ArrowRight"].includes(ev.code)) { ev.preventDefault(); advance(); }
  if (ev.code === "ArrowLeft") back();
  if (ev.code === "KeyA") toggleAuto();
});

(async function boot() {
  try {
    const res = await fetch("/api/facile/play");
    story = await res.json();
  } catch (e) {
    story = { title: "Lecture", scenes: [] };
  }
  $("book").textContent = story.title;
  document.title = story.title;
  if (!story.scenes.length) { $("empty").classList.add("on"); return; }
  loadProgress();
  if (si === 0 && li === 0) { startScene(0); } else { showTitle(story.scenes[si].title, story.scenes[si].chapter); showLine(); }
})();
</script>
</body>
</html>
