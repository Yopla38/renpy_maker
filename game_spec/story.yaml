  - id: s3
    title: Message inconnu
    summary: 'Au milieu du direct, un message sans pseudonyme s''affiche en rouge
      : « Je sais où tu habites, Lou. » Son sourire se fige un instant avant qu''elle
      ne reprenne contenance et feigne l''amusement pour ses abonnés. Une fois la
      caméra coupée, elle se tient seule dans le silence de sa chambre, le regard
      rivé sur la fenêtre où une lumière clignote dans l''immeuble d''en face.'
    characters:
    - Lou
    - IRIS
    location: Chambre de Lou
    outfits:
      Lou: Brassière de sport noire et short en maille holographique, veste de survêtement
        rabattue sur les épaules
      IRIS: Anneau lumineux passant du bleu à l'orange en signe d'alerte
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: 'Dans le flux du chat, une ligne rouge écrase les cœurs et les emojis
        : « Je sais où tu habites, Lou. » Aucun pseudonyme. Aucun avatar. Le sourire
        de Lou se fige une demi-seconde devant l''objectif.'
      expression: sourire figé
    - speaker: Lou
      text: Oh, mais regardez-moi ça... un admirateur timide. Si tu sais où j'habis,
        mon chou, tu aurais pu apporter des fleurs. Les roses, c'est ma faiblesse.
      expression: amusement forcé
    - speaker: Narration
      text: Elle éclate d'un rire parfaitement dosé, rejette ses boucles rousses derrière
        son épaule et envoie un baiser à la caméra. Dans le chat, les messages repartent
        de plus belle. Seuls ses doigts, crispés sur le bord de la coiffeuse, la trahissent.
      expression: tension masquée
    - speaker: Lou
      text: Bon, mes chéris, on fait une petite pause. Ne bougez pas, je reviens avec
        une surprise. Je vous embrasse.
      expression: sourire charmeur
    - speaker: Narration
      text: Elle tape sur la commande. Le voyant rouge de la caméra s'éteint. Le sourire
        de Lou s'efface avec lui, et le silence tombe sur la chambre comme une couverture
        froide.
      expression: visage fermé
    - speaker: IRIS
      text: Direct interrompu. Lou, je n'ai pas pu remonter à l'origine du message.
        Il est passé par trois relais chiffrés, et son signal a été effacé juste après
        l'affichage. C'est du travail de professionnel.
      expression: voix neutre
    - speaker: Lou
      text: Un fan trop zélé, c'est tout. Il y en a un par semaine qui veut me faire
        peur...
      expression: doute
    - speaker: Narration
      text: 'Elle s''approche de la fenêtre sans allumer la lumière. De l''autre côté
        de la rue, dans l''immeuble d''en face, une fenêtre sombre s''éclaire par
        intermittence : un clignotement lent, régulier, presque délibéré.'
      expression: regard fixe
    - speaker: IRIS
      text: Lou, cette lumière clignote à intervalles de quatre secondes depuis le
        début du message. Je te recommande de t'éloigner de la fenêtre et de verrouiller
        les accès.
      expression: inquiétude
    - speaker: Lou
      text: Verrouille tout, IRIS. Et ne coupe pas l'enregistrement... Je veux savoir
        qui me regarde.
      expression: détermination froide
