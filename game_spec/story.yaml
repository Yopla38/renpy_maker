  - id: s2
    title: Mademoiselle Éloïse
    summary: 'Dans le grand hall, Greg est accueilli par Éloïse, la jeune propriétaire,
      qui s''excuse pour le désordre et pour le tapis qui lui a dérobé son parapluie.
      Elle lui décrit les pannes : lumières qui clignotent, prises qui chauffent,
      couloirs qui changent de longueur. Greg prend des notes avec scepticisme, jusqu''à
      ce qu''un lustre se mette à pencher vers lui comme pour l''observer.'
    characters:
    - Greg
    - Éloïse
    location: Grand hall du manoir
    outfits:
      Greg: Combinaison de travail bleue, ceinture à outils, carnet de notes à la
        main
      Éloïse: Longue robe verte passée de mode, gilet en laine gris, cheveux attachés
        en chignon lâche
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: La lourde porte d'entrée se referme derrière Greg sans que personne l'ait
        touchée. Au centre du grand hall, Éloïse serre ses mains l'une contre l'autre,
        l'air gêné.
      expression: gêne
    - speaker: Éloïse
      text: Pardonnez le désordre, Monsieur Greg. Et pardonnez aussi le tapis… il
        a pris votre parapluie, je crois. Il fait ça avec tous les visiteurs. Je vous
        promets de le récupérer.
      expression: gêne
    - speaker: Greg
      text: Le tapis a pris mon parapluie. Bien sûr. Bon, passons. Dites-moi plutôt
        ce qui ne va pas, côté électricité.
      expression: scepticisme
    - speaker: Éloïse
      text: Les lumières clignotent, surtout la nuit. Certaines prises deviennent
        brûlantes sans raison. Et les couloirs… ils changent de longueur. Hier, il
        m'a fallu dix minutes pour aller à la cuisine.
      expression: inquiétude
    - speaker: Greg
      text: 'Des couloirs qui s''allongent... Je note : « problème de perception de
        la propriétaire ». Ou de l''installation. On verra.'
      expression: ironie
    - speaker: Narration
      text: Greg griffonne dans son carnet, sourcils froncés. Au-dessus de lui, le
        lustre de cristal tinte doucement, puis commence à s'incliner lentement, comme
        un curieux penché sur son épaule.
      expression: tension
    - speaker: Éloïse
      text: Ne bougez pas, je vous en prie. Il vous observe. Il fait toujours ça quand
        quelqu'un lui plaît… ou lui fait peur.
      expression: douceur
    - speaker: Greg
      text: 'Je ne sais pas laquelle des deux options me rassure le moins. Dites-moi,
        Mademoiselle Éloïse : ce lustre, il est bien fixé au plafond, au moins ?'
      expression: méfiance
    - speaker: Éloïse
      text: Tant qu'il vous trouve sympathique, oui. Alors, si j'étais vous, je lui
        sourirais.
      expression: sourire timide
    - speaker: Greg
      text: Génial. Une journée de travail, et je dois séduire un lustre.
      expression: résignation
