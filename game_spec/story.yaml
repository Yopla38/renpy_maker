  - id: s2
    title: Les spectateurs réclament
    summary: Lou lit à voix haute les commentaires qui défilent sur l'écran, répond
      avec malice et taquine ceux qui la supplient de lui consacrer un moment privé.
      Elle s'étire devant la caméra, déambule dans la pièce en faisant ressortir sa
      silhouette athlétique, puis s'approche de l'objectif en murmurant des promesses
      pour la suite de la soirée. La caméra capte chaque regard et chaque sourire,
      comme si le spectateur était réellement dans la pièce.
    characters:
    - Lou
    - IRIS
    location: Chambre de Lou
    outfits:
      Lou: Brassière de sport noire et short en maille holographique, veste de survêtement
        transparente glissée sur une épaule
      IRIS: Anneau lumineux bleu qui pulse à chaque nouveau message
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: Lou se redresse face à l'objectif. Le compteur de spectateurs grimpe en
        flèche, et les commentaires envahissent la fenêtre du chat. Dans l'image,
        sa chevelure rousse accroche la lumière chaude des guirlandes.
      expression: neutre
    - speaker: Lou
      text: Alors, voyons ce que vous me réclamez... « Lou, un moment privé, s'il
        te plaît ! » « On veut plus ! » « Rien que pour moi, juste dix minutes ! »
        Oh là là, mais vous êtes insatiables, ce soir.
      expression: sourire taquin
    - speaker: IRIS
      text: Le nombre de demandes d'accès privé a triplé en quatre minutes. Souhaites-tu
        que j'active la file d'attente VIP ?
      expression: neutre
    - speaker: Lou
      text: Pas encore, IRIS. Ils doivent mériter ça. Ce qu'on désire trop facilement
        perd toute sa saveur, non ?
      expression: malicieuse
    - speaker: Narration
      text: Elle se lève lentement, lève les bras au-dessus de la tête et s'étire
        comme un chat. Son débardeur remonte légèrement sur son ventre ferme et dessiné.
        Elle laisse échapper un petit soupir satisfait, en gardant les yeux rivés
        sur l'objectif.
      expression: sourire
    - speaker: Lou
      text: Quelqu'un a écrit « Montre-nous ta salle de sport ». Désolée, mon chéri,
        aujourd'hui, c'est séance d'entraînement privée... et vous n'êtes pas invités.
        Enfin, pas tous.
      expression: clin d'œil
    - speaker: Narration
      text: Elle déambule dans la chambre, d'un pas souple et chaloupé, effleure le
        dossier d'une chaise, puis la commode, et jette un regard par-dessus son épaule.
        La caméra de drone d'IRIS la suit, et chaque mouvement de hanche semble calculé.
      expression: séductrice
    - speaker: IRIS
      text: Lou, le message anonyme s'est affiché une seconde fois. Même formulation.
        Je ne peux toujours pas en tracer l'origine.
      expression: inquiétude
    - speaker: Lou
      text: Chut, IRIS... pas devant tout le monde. Ce n'est qu'un petit malin qui
        s'amuse.
      expression: agacée
    - speaker: Narration
      text: Elle s'approche de l'objectif jusqu'à ce que ses grands yeux bleus remplissent
        l'écran. Un sourire éclaire son visage, mais son regard glisse une fraction
        de seconde vers la fenêtre, comme si elle avait senti quelque chose.
      expression: trouble fugace
    - speaker: Lou
      text: Restez avec moi, mes chéris... Cette soirée ne fait que commencer, et
        j'ai quelques surprises pour ceux qui seront sages. Très sages.
      expression: murmure séducteur
