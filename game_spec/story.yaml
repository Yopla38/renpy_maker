- id: ch2
  title: Dans les champs
  summary: 'Quelques jours après leur première vraie conversation, Pierre revient
    plus tôt, comme promis. Eve a décidé de lui faire comprendre qu''il ne lui est
    pas indifférent : elle s''est habillée d''une jupe légère et l''attend dans les
    prés. Entre taquineries, maladresses et pause à l''ombre d''un chêne, le jeu de
    séduction s''installe doucement et débouche sur un premier rendez-vous.'
  scene_count: 3
  locked: false
  scenes:
  - id: s4
    title: Une tenue inhabituelle
    summary: Pierre arrive à la ferme, mais Eve n'est pas à l'étable. Son père lui
      indique qu'elle travaille dans les champs. En la découvrant au bout du sentier,
      vêtue d'une jupe légère au milieu des herbes hautes, il en perd ses mots. Eve,
      qui l'a vu venir de loin, feint de n'avoir rien prévu et lui lance un « Tu es
      en avance, encore ».
    characters:
    - Eve
    - Pierre
    - Le père d'Eve
    location: Sentier du grand pré
    outfits:
      Eve: Jupe d'été légère à fleurs, chemisier blanc noué à la taille, bottines
        de cuir, cheveux blonds lâchés
      Pierre: Jean usé, t-shirt gris, casquette de toile, bottes de travail
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: 'Le soleil de fin de matinée écrase le grand pré. Pierre s''est garé devant
        la ferme plus tôt que jamais, mais l''étable est vide. Le père d''Eve, en
        train de réparer une clôture, lève le menton vers le fond du sentier : « Elle
        est dans les champs, va donc la voir. »'
      expression: neutre
    - speaker: Narration
      text: 'Pierre s''engage sur le sentier bordé d''herbes hautes. Au bout du chemin,
        une silhouette se découpe dans la lumière : Eve, les cheveux blonds dénoués,
        une jupe légère qui danse autour de ses genoux au gré de la brise.'
      expression: émerveillé
    - speaker: Pierre
      text: Eve... je... enfin, bonjour. Tu... c'est... Il y a du vent aujourd'hui,
        non ?
      expression: gêné, bafouillant
    - speaker: Narration
      text: Eve l'a vu arriver de loin, mais elle se redresse lentement, une main
        sur la hanche, comme si de rien n'était. Un sourire en coin lui échappe malgré
        elle.
      expression: sourire en coin
    - speaker: Eve
      text: Tu es en avance, encore. Tu fais exprès, ou tu ne sais simplement pas
        lire l'heure ?
      expression: taquine
    - speaker: Pierre
      text: Je t'avais dit que je viendrais plus tôt. Je ne pensais pas... te trouver
        dans un endroit aussi... enfin, aussi joli. Le pré, je veux dire. Le pré est
        très joli.
      expression: rougissant
    - speaker: Eve
      text: Le pré, bien sûr. Il a de la chance de te plaire autant. Moi, j'ai simplement
        pensé que les vaches méritaient un peu d'élégance, aujourd'hui.
      expression: amusée
    - speaker: Pierre
      text: Les vaches ont bon goût, alors. Et moi aussi, apparemment, puisque je
        suis encore là à raconter n'importe quoi.
      expression: rire gêné
    - speaker: Narration
      text: Eve éclate de rire, d'un rire clair qui envole quelques oiseaux des herbes.
        Elle désigne du menton le grand chêne, un peu plus loin, dont l'ombre s'étend
        sur le pré.
      expression: rieuse
    - speaker: Eve
      text: Viens, ramasse ton courage et suis-moi. Il y a de l'ombre là-bas, et j'ai
        apporté de l'eau fraîche. Tu me raconteras tes projets... et peut-être pourquoi
        tu perds tes mots.
      expression: complice
