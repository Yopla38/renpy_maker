  - id: s5
    title: La clôture à réparer
    summary: 'Eve prétexte une clôture endommagée pour demander l''aide de Pierre.
      Pendant qu''ils tendent le fil, elle multiplie les petites provocations : un
      regard appuyé, une remarque espiègle sur sa maladresse, la jupe que le vent
      fait danser. Pierre, tout rouge, tente de rester concentré, et le jeu les fait
      éclater de rire. Ils comprennent tous deux que l''autre n''est pas dupe.'
    characters:
    - Eve
    - Pierre
    location: Pré en bordure de la ferme
    outfits:
      Eve: Jupe d'été légère à fleurs, chemisier blanc noué à la taille, gants de
        travail, bottines de cuir
      Pierre: Jean usé, t-shirt gris légèrement humide de sueur, gants de travail,
        casquette de toile
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: Ils n'ont pas fait dix pas vers le chêne qu'Eve s'arrête net devant la
        clôture, où un fil pend mollement entre deux piquets. Elle porte la main à
        sa bouche, l'air faussement catastrophé.
      expression: surprise feinte
    - speaker: Eve
      text: Oh non, regarde ça ! Le fil a lâché. Si les vaches passent par là, mon
        père va me faire une scène. Tu pourrais m'aider cinq minutes, Pierre ? Ça
        tombe bien, tu as l'air d'avoir de bons bras.
      expression: espiègle
    - speaker: Pierre
      text: Cinq minutes... oui, bien sûr. Enfin, je ne suis pas un expert en clôtures,
        mais je peux tenir un fil. Je crois.
      expression: gêné
    - speaker: Narration
      text: Il attrape le fil et tire de toutes ses forces. Eve se place tout près
        de lui pour tenir l'autre extrémité. Son regard s'attarde sur lui un peu trop
        longtemps, et le vent soulève sa jupe légère, qui danse autour de ses genoux.
      expression: malicieuse
    - speaker: Eve
      text: Tu tires dans le mauvais sens, tu sais. À moins que tu veuilles aussi
        réparer la clôture du voisin ?
      expression: sourire en coin
    - speaker: Pierre
      text: Ah ! Non, pardon, c'est que... le vent, la jupe... je veux dire, la clôture
        ! Le vent dans la clôture, c'est pénible, ça m'a distrait.
      expression: rouge de confusion
    - speaker: Narration
      text: Il lâche le fil, qui lui claque contre la main. Il pousse un petit cri,
        secoue ses doigts, et Eve éclate de rire, pliée en deux contre un piquet.
      expression: hilare
    - speaker: Eve
      text: Tu es adorable quand tu rougis. Et tu es un très mauvais menteur, Pierre.
        Tu sais que cette clôture n'a jamais été cassée, n'est-ce pas ?
      expression: regard franc
    - speaker: Pierre
      text: Je m'en doutais, oui. Elle est plus solide que moi. Mais je n'ai rien
        dit, parce que... je n'avais pas envie de partir.
      expression: sourire timide
    - speaker: Narration
      text: Leurs rires se mêlent un instant dans le vent. Aucun des deux ne cherche
        plus à faire semblant, et le silence qui suit n'a rien de gênant.
      expression: complices
    - speaker: Eve
      text: Alors reste. Et samedi soir, au lieu de réparer des clôtures qui n'existent
        pas, tu pourrais m'inviter à dîner. Pour de vrai, cette fois.
      expression: sourire tendre
