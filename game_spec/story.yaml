synopsis: Une jeune femme de 21 ans, rousse au yeux vert très jolie, se promene dans
  la foret et rencontre un géant
chapters:
- id: ch1
  title: La mise
  summary: 'Mathilde, 21 ans, jeune femme rousse aux yeux verts, s''enfonce dans la
    forêt de Brocéliande pour échapper à ses soucis. Elle y croise un géant d''une
    douceur inattendue, qui lui propose un étrange marché : une partie de dés, dont
    l''enjeu reste à définir. Intriguée, elle accepte de s''asseoir face à lui, sans
    savoir ce qu''elle s''apprête à miser.'
  scene_count: 3
  locked: false
  scenes:
  - id: s1
    title: Le sentier oublié
    summary: 'Mathilde quitte le chemin balisé pour suivre un sentier couvert de mousse,
      bercée par le chant des oiseaux. Elle repense à la lettre de la banque qu''elle
      a laissée sur sa table et à la dette qui pèse sur sa famille. Peu à peu, le
      silence de la forêt devient étrange : les oiseaux se taisent et le sol tremble
      légèrement.'
    characters:
    - Mathilde
    location: Forêt de Brocéliande, sentier de mousse
    outfits:
      Mathilde: Veste en toile verte, pull crème, jean brut et bottines de marche
        usées, cheveux roux attachés en tresse lâche
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: Mathilde quitte le chemin balisé. Sous ses pas, la mousse étouffe les
        bruits, et la lumière filtrée par les feuilles dore ses cheveux roux.
      expression: sérénité
    - speaker: Mathilde
      text: Un petit détour, juste un… Personne ne m'attend de toute façon.
      expression: sourire las
    - speaker: Narration
      text: 'Les oiseaux chantent au-dessus d''elle. Pourtant, ses yeux verts se voilent
        : elle repense à la lettre de la banque, restée sur sa table de cuisine.'
      expression: mélancolie
    - speaker: Mathilde
      text: Quarante mille euros… Papa n'a pas dormi depuis des semaines. Et moi,
        je ne sais même pas par où commencer.
      expression: inquiétude
    - speaker: Mathilde
      text: Ici au moins, rien ne me demande de comptes. Juste les arbres, la mousse
        et…
      expression: soulagement
    - speaker: Narration
      text: Elle s'arrête. Le chant des oiseaux vient de cesser, d'un coup, comme
        si quelqu'un avait refermé une porte sur le monde.
      expression: surprise
    - speaker: Mathilde
      text: Tiens… Où sont-ils passés ?
      expression: méfiance
    - speaker: Narration
      text: Un tremblement sourd remonte du sol. Les feuilles frissonnent, une brindille
        saute sur le sentier. Puis un second tremblement, plus fort, régulier, comme
        un pas.
      expression: tension
    - speaker: Mathilde
      text: Ce n'est pas un orage… Ça se rapproche.
      expression: peur contenue
    - speaker: Narration
      text: Mathilde serre la bandoulière de son sac, le cœur battant, et ne parvient
        pas à détourner les yeux de l'ombre immense qui se dessine entre les troncs.
      expression: appréhension
    plans: []
    decor: []
  - id: s2
    title: L'ombre entre les chênes
    summary: Au détour d'un tournant, Mathilde se retrouve face à un géant de plus
      de quatre mètres, assis contre un chêne millénaire. Elle recule, effrayée, mais
      il s'excuse d'une voix grave et timide, expliquant qu'il n'a pas parlé à un
      humain depuis des siècles. Fascinée par son regard bienveillant, elle se laisse
      apprivoiser peu à peu et se présente.
    characters:
    - Mathilde
    - Orgrim, le géant
    location: Clairière aux chênes millénaires
    outfits:
      Mathilde: Veste en toile verte, pull crème, jean brut et bottines de marche
        usées, cheveux roux attachés en tresse lâche
      Orgrim, le géant: Grande tunique de laine brune rapiécée, ceinture de corde
        épaisse, pieds nus, barbe grise tressée
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: Au détour d'un tournant, les troncs s'écartent sur une clairière. Adossé
        à un chêne millénaire, un géant de plus de quatre mètres est assis, les mains
        posées sur ses genoux. Mathilde s'arrête net.
      expression: stupeur
    - speaker: Mathilde
      text: Oh non… Non, non, non. Ce n'est pas possible.
      expression: effroi
    - speaker: Narration
      text: Elle recule d'un pas, son talon accroche une racine et elle manque de
        tomber. Le géant se redresse à peine, les paumes ouvertes, comme pour montrer
        qu'il ne veut aucun mal.
      expression: peur
    - speaker: Orgrim, le géant
      text: Pardon… Pardon, je ne voulais pas t'effrayer. Je me suis assis exprès,
        pour paraître moins grand. Cela ne marche pas très bien, je crois.
      expression: gêné
    - speaker: Mathilde
      text: Vous… vous parlez ? Et vous parlez comme quelqu'un de poli, en plus.
      expression: surprise
    - speaker: Orgrim, le géant
      text: Cela fait des siècles que je n'ai pas parlé à un humain. J'ai peur d'avoir
        perdu l'habitude des mots. Et du reste.
      expression: timide
    - speaker: Narration
      text: Sa voix grave fait vibrer les feuilles, mais son regard, couleur d'ambre
        sombre, n'a rien de menaçant. Mathilde sent son cœur ralentir, malgré elle.
      expression: douceur
    - speaker: Mathilde
      text: Vous avez l'air… plus intimidé que moi, en fait.
      expression: sourire hésitant
    - speaker: Orgrim, le géant
      text: C'est possible. Je m'appelle Orgrim. Et toi, qui es-tu, toi qui as eu
        le courage de ne pas t'enfuir ?
      expression: espoir
    - speaker: Mathilde
      text: Mathilde. Je me promenais pour oublier mes soucis. Je crois que j'en ai
        trouvé un nouveau, et pas des moindres.
      expression: sourire amusé
    - speaker: Narration
      text: Orgrim laisse échapper un rire sourd et surpris, qui fait s'envoler quelques
        oiseaux des branches. Pour la première fois depuis longtemps, il a l'air heureux.
      expression: joie
    plans: []
    decor: []
  - id: s3
    title: La partie de dés
    summary: 'Orgrim sort de sa poche deux dés de la taille d''un poing et propose
      à Mathilde une partie : s''il perd, il lui offrira ce qu''elle désire le plus
      ; si elle perd, elle devra lui accorder quelque chose, qu''il ne dévoile pas
      encore. Mathilde hésite, pensant à sa dette, puis relève le défi avec un sourire
      déterminé. Les dés roulent dans l''herbe tandis que la forêt retient son souffle.'
    characters:
    - Mathilde
    - Orgrim, le géant
    location: Clairière aux chênes millénaires
    outfits:
      Mathilde: Veste en toile verte, pull crème, jean brut et bottines de marche
        usées, cheveux roux attachés en tresse lâche
      Orgrim, le géant: Grande tunique de laine brune rapiécée, ceinture de corde
        épaisse, pieds nus, barbe grise tressée
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: Orgrim plonge deux doigts épais dans la poche de sa veste de peau et en
        sort deux dés d'os poli, chacun de la taille d'un poing. Il les dépose dans
        l'herbe, entre Mathilde et lui. Les points gravés luisent comme de la braise.
      expression: mystérieux
    - speaker: Orgrim, le géant
      text: Une partie, Mathilde. Rien qu'une. Si je perds, je t'offre ce que tu désires
        le plus au monde.
      expression: sourire en coin
    - speaker: Mathilde
      text: Ce que je désire le plus… Ce n'est pas une promesse à faire à la légère,
        Orgrim. Et si c'est moi qui perds ?
      expression: méfiance
    - speaker: Orgrim, le géant
      text: Alors tu m'accorderas quelque chose. Je ne te dirai pas quoi, pas encore.
      expression: énigmatique
    - speaker: Narration
      text: Mathilde baisse les yeux. Elle pense à la lettre pliée au fond de son
        sac, à la somme qu'elle doit et qui lui serre la gorge chaque matin. Une mèche
        rousse glisse sur sa joue, qu'elle repousse d'un geste nerveux.
      expression: hésitation
    - speaker: Mathilde
      text: Un marché dont je ne connais qu'une moitié… C'est de la folie.
      expression: inquiétude
    - speaker: Orgrim, le géant
      text: Peut-être. Mais tu as déjà eu le courage de rester devant un géant. Je
        crois que tu n'es pas du genre à reculer.
      expression: douceur
    - speaker: Mathilde
      text: Vous m'avez bien cernée. D'accord, Orgrim. Jouons.
      expression: sourire déterminé
    - speaker: Narration
      text: Elle s'assoit en tailleur dans l'herbe fraîche, face à lui, et ramasse
        les dés à deux mains. Ils sont lourds, étrangement tièdes. Autour de la clairière,
        le vent tombe et les chênes millénaires semblent se pencher pour mieux voir.
      expression: tension
    - speaker: Mathilde
      text: Que la chance me sourie, pour une fois.
      expression: concentration
    - speaker: Narration
      text: Les dés quittent ses doigts, roulent dans l'herbe en claquant sourdement,
        et la forêt entière retient son souffle.
      expression: suspense
    plans: []
    decor: []
