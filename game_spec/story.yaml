  - id: s6
    title: Sous le grand chêne
    summary: La chaleur monte et Eve sort de son panier du pain, du fromage et de
      la limonade. Ils s'installent à l'ombre du grand chêne et parlent de leurs rêves
      et de ce que la campagne a de beau. Après un silence chargé, Pierre prend son
      courage à deux mains et l'invite à la fête du village samedi soir. Eve répond
      avec un sourire malicieux qu'elle y réfléchira, mais ses yeux disent déjà oui.
    characters:
    - Eve
    - Pierre
    location: Sous le grand chêne, au sommet de la colline
    outfits:
      Eve: Jupe d'été légère à fleurs, chemisier blanc noué à la taille, pieds nus
        dans l'herbe, bottines posées à côté
      Pierre: Jean usé, t-shirt gris, casquette posée sur le genou, bottes de travail
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: La chaleur monte sur la colline. Sous le grand chêne, l'ombre est fraîche
        et les feuilles bruissent doucement. Eve pose son panier dans l'herbe et en
        sort du pain, un morceau de fromage et une bouteille de limonade encore humide.
      expression: calme
    - speaker: Eve
      text: Voilà, mon grand stratagème pour te garder ici. Du pain de ce matin, du
        fromage de la ferme, et de la limonade de ma mère. Personne n'a jamais résisté
        à sa limonade.
      expression: sourire taquin
    - speaker: Pierre
      text: Alors je suis fichu. Je n'avais déjà pas beaucoup de volonté, et là, tu
        sors l'artillerie lourde.
      expression: sourire gêné
    - speaker: Narration
      text: Ils s'installent dos au tronc, épaule contre épaule sans vraiment l'avoir
        décidé. En contrebas, les vaches ne sont plus que des taches pâles dans les
        prés.
      expression: douceur
    - speaker: Pierre
      text: Quand j'étais petit, je voulais partir loin, voir la mer, les grandes
        villes. Et maintenant, je regarde cette vallée et je me dis que je ne voudrais
        être nulle part ailleurs.
      expression: rêveur
    - speaker: Eve
      text: Moi, je rêve d'agrandir le troupeau, de faire mon propre fromage, peut-être
        d'ouvrir un petit stand au marché. Rien de grandiose. Mais ici, le matin,
        quand la brume se lève sur les champs, j'ai l'impression que le monde m'appartient
        un peu.
      expression: yeux brillants
    - speaker: Narration
      text: Un silence s'installe. Le vent joue dans l'herbe haute. Pierre tourne
        la bouteille entre ses doigts, comme s'il y cherchait ses mots.
      expression: tension douce
    - speaker: Pierre
      text: 'Eve... tout à l''heure, tu parlais d''un dîner, et moi, j''ai fait celui
        qui n''avait pas compris. Alors voilà, je me lance : il y a la fête du village,
        samedi soir. Est-ce que tu voudrais y aller avec moi ?'
      expression: nerveux, sincère
    - speaker: Eve
      text: Hmm... La fête du village. Avec la musique, les lampions, et tout le monde
        qui nous regardera arriver ensemble ?
      expression: sourire malicieux
    - speaker: Eve
      text: 'Je vais y réfléchir, Pierre. Il faut que je consulte mon emploi du temps,
        très chargé, tu comprends : les vaches, le fromage, la limonade...'
      expression: air faussement sérieux
    - speaker: Narration
      text: 'Pierre baisse les yeux, un peu déçu, puis croise son regard. Dans les
        yeux d''Eve, il n''y a ni hésitation ni doute : la réponse y est déjà, lumineuse,
        et il sourit à son tour.'
      expression: tendresse
