chapters:
- id: ch1
  title: '2050'
  summary: En 2050, Lou, 21 ans, rousse aux grands yeux bleus et au corps athlétique,
    est l'une des créatrices de contenu les plus suivies du réseau. Depuis sa chambre,
    nous la découvrons uniquement à travers l'objectif de sa caméra. Elle joue de
    son charme avec ses spectateurs, mais un message mystérieux vient troubler le
    direct.
  scene_count: 3
  locked: false
  scenes:
  - id: s1
    title: Le point rouge s'allume
    summary: L'écran affiche l'image tremblante de la caméra, puis se stabilise sur
      Lou qui règle l'angle de son drone-caméra dans sa chambre baignée de néons.
      Elle ajuste ses boucles rousses, fixe l'objectif de ses grands yeux bleus et
      sourit d'un air complice. L'IA de la caméra, IRIS, annonce que le direct démarre
      et que les spectateurs affluent déjà par milliers.
    characters:
    - Lou
    - IRIS
    location: Chambre de Lou
    outfits:
      Lou: Brassière de sport noire moulante et short taille haute en maille holographique,
        cheveux roux détachés
      IRIS: Voix synthétique, représentée par un anneau lumineux bleu autour de l'objectif
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: Un point rouge s'allume dans un coin de l'écran. L'image tremble, saccadée,
        puis se stabilise. Dans la chambre baignée de néons roses et bleus, Lou apparaît,
        légèrement penchée vers l'objectif.
      expression: neutre
    - speaker: Lou
      text: Un peu plus à gauche, IRIS... Non, trop. Voilà. Là, mes boucles attrapent
        bien la lumière, tu ne trouves pas ?
      expression: concentration
    - speaker: IRIS
      text: Cadrage optimal atteint. Ta chevelure rousse augmente l'engagement visuel
        de douze pour cent avec cet éclairage, Lou.
      expression: voix calme
    - speaker: Narration
      text: Lou recule d'un pas, passe une main dans ses boucles rousses et fixe l'objectif
        de ses grands yeux bleus. Un sourire complice se dessine lentement sur ses
        lèvres.
      expression: sourire complice
    - speaker: Lou
      text: Douze pour cent, hein ? Je vais tâcher de faire encore mieux ce soir.
        Prête quand tu veux.
      expression: sourire en coin
    - speaker: IRIS
      text: Le direct démarre dans trois, deux, un... Tu es en ligne. Quatre mille
        spectateurs sont déjà connectés, et le compteur grimpe encore.
      expression: enthousiasme mesuré
    - speaker: Lou
      text: Coucou, mes chéris... Vous m'avez attendue ? Installez-vous bien, ce soir,
        je suis d'humeur à vous gâter.
      expression: regard charmeur
    - speaker: Narration
      text: Elle s'assoit sur le rebord de son lit, une jambe croisée sur l'autre,
        et effleure du doigt le bord de son débardeur en lançant un clin d'œil à la
        caméra. Dans la fenêtre du chat, les messages défilent à toute vitesse.
      expression: aguicheuse
    - speaker: IRIS
      text: 'Lou, un message anonyme vient d''apparaître en priorité dans le chat.
        Il ne provient d''aucun compte répertorié. Il dit : « Éteins la caméra. Ils
        t''observent. »'
      expression: inquiétude
    - speaker: Lou
      text: Hein ? ... Sans doute une blague d'un troll. Ignore-le, IRIS. On ne va
        pas laisser un inconnu gâcher la soirée.
      expression: sourire crispé
