chapters:
- id: ch1
  title: La rencontre
  summary: Un matin d'été, Eve termine la traite dans l'étable de la ferme familiale
    lorsque Pierre, le voisin venu chercher le lait comme chaque semaine, arrive plus
    tôt que prévu. Ce qui n'était qu'une routine se transforme en une conversation
    pleine de petites maladresses et de rires complices. À la fin de la matinée, tous
    deux sentent que ces visites ne seront plus tout à fait comme avant.
  scene_count: 3
  locked: true
  scenes:
  - id: s1
    title: Une traite matinale
    summary: Aux premières lueurs du jour, Eve s'occupe seule des vaches dans l'étable
      en fredonnant. Elle est fatiguée mais fière de son travail, et prend le temps
      de parler à chacune de ses bêtes. Elle remarque qu'elle est en avance sur sa
      tâche et que les bidons de lait sont presque prêts.
    characters:
    - Eve
    location: L'étable de la ferme
    outfits:
      Eve: Salopette en jean sur un t-shirt blanc, bottes en caoutchouc vertes, cheveux
        blonds attachés en une longue tresse
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: Les premières lueurs du jour glissent entre les planches de l'étable et
        dorent la poussière en suspension. Une odeur de foin tiède et de lait frais
        flotte dans l'air.
      expression: calme
    - speaker: Eve
      text: (elle fredonne, le front appuyé contre le flanc d'une vache) Mmh mm mmh...
        Voilà, ma belle, doucement...
      expression: sourire paisible
    - speaker: Eve
      text: Toi, Marguerite, tu es toujours la plus généreuse. Si toutes tes copines
        avaient ton courage, je serais déjà au lit !
      expression: sourire taquin
    - speaker: Narration
      text: Eve s'étire en grimaçant, une main dans le creux des reins. Ses yeux sont
        cernés, mais un petit sourire fier ne la quitte pas.
      expression: fatigue
    - speaker: Eve
      text: Ne fais pas cette tête, Noiraude. Je sais que tu aimes les caresses avant
        la traite. Tiens... là, derrière l'oreille. Voilà, tu ronronnerais presque
        !
      expression: tendresse
    - speaker: Narration
      text: Un meuglement satisfait lui répond. Eve éclate de rire et sa voix résonne
        sous la charpente.
      expression: rire
    - speaker: Eve
      text: (elle jette un coup d'œil vers le fond de l'étable) Attends... Les bidons
        sont déjà presque pleins ? Et il n'est même pas encore sept heures !
      expression: surprise
    - speaker: Eve
      text: Eh bien, mesdames, on a cinq minutes d'avance. Je crois que ça mérite
        un petit morceau de pain sec pour tout le monde.
      expression: fierté
    - speaker: Narration
      text: Elle essuie ses mains sur son tablier et rejette en arrière une mèche
        blonde échappée de sa tresse. Dehors, le soleil monte doucement sur la cour
        de la ferme.
      expression: sérénité
    - speaker: Eve
      text: Ce sera une belle journée, je le sens. Allez, on termine tranquillement,
        et ensuite... un bon café, enfin.
      expression: sourire rêveur
