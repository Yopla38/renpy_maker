chapters:
- id: ch1
  title: 'Chapitre 1 : Court-circuit'
  summary: 'Greg, électricien un peu blasé, est appelé en urgence pour réparer l''installation
    électrique d''un vieux manoir isolé. Dès son arrivée, il remarque que les lieux
    se comportent de façon étrange : les portes s''ouvrent seules et les lampes s''allument
    à son passage. La propriétaire, la discrète Mademoiselle Éloïse, lui avoue que
    le manoir est vivant à sa manière, et que c''est lui qui est « malade ».'
  scene_count: 3
  locked: false
  scenes:
  - id: s1
    title: La grille qui s'ouvre toute seule
    summary: Greg arrive sous une pluie fine devant le manoir de Valbrume, camionnette
      chargée de câbles et d'outils. La grille rouillée s'ouvre d'elle-même dans un
      grincement presque poli, et les lanternes du jardin s'allument une à une pour
      guider sa route. Greg hausse un sourcil, persuadé qu'il s'agit d'un vieux système
      à détecteur, mais il ne trouve aucun capteur nulle part.
    characters:
    - Greg
    location: Allée et jardin du manoir de Valbrume
    outfits:
      Greg: Combinaison de travail bleue, ceinture à outils, casque de chantier jaune
        sous le bras, bottes de sécurité
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: La pluie fine tambourine sur le toit de la camionnette. Au bout du chemin
        de gravier, le manoir de Valbrume se découpe contre le ciel gris, toutes fenêtres
        sombres.
      expression: neutre
    - speaker: Greg
      text: Bon. Un manoir isolé, un appel en urgence, et il pleut. On ne pouvait
        pas me proposer un pavillon en lotissement, pour une fois ?
      expression: soupir las
    - speaker: Narration
      text: Il s'arrête devant la grille rouillée et cherche déjà l'interphone du
        regard. Mais avant qu'il ne coupe le moteur, les barreaux s'écartent dans
        un long grincement, presque poli.
      expression: surprise
    - speaker: Greg
      text: Ah. Ouverture automatique. Au moins, quelque chose marche ici.
      expression: sourcil levé
    - speaker: Narration
      text: Il avance lentement. Le long de l'allée, les lanternes du jardin s'allument
        une à une, juste devant lui, comme pour l'inviter à suivre la lumière.
      expression: neutre
    - speaker: Greg
      text: Détecteur de présence... Ça doit être un vieux système sur cellule. Même
        si, sur une installation censée être en panne, c'est un comble.
      expression: scepticisme
    - speaker: Narration
      text: Greg descend de la camionnette, la capuche relevée, et fait le tour des
        poteaux de la grille puis des lanternes. Il passe la main derrière chaque
        socle, cherche un capteur, un fil, une cellule. Rien.
      expression: concentration
    - speaker: Greg
      text: Pas de capteur. Pas de câble apparent. Pas même une boîte de dérivation...
        Alors, qui vous alimente, vous ?
      expression: méfiance
    - speaker: Narration
      text: La lanterne la plus proche vacille doucement, puis retrouve son éclat,
        comme si elle avait entendu la question.
      expression: mystère
    - speaker: Greg
      text: Très bien. Je ne dis rien, je ne touche à rien, et je regarde le tableau
        électrique en premier. Ça, au moins, ça ne ment pas.
      expression: résigné
