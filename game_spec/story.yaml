  - id: s2
    title: Le voisin en avance
    summary: Pierre pousse la grande porte de l'étable, surpris de trouver Eve seule
      au lieu de ses parents. Elle l'avait déjà croisé de loin, mais ils ne s'étaient
      jamais vraiment parlé. Gêné, il trébuche presque sur un seau, ce qui les fait
      rire tous les deux et brise la glace.
    characters:
    - Eve
    - Pierre
    location: L'étable de la ferme, près de l'entrée
    outfits:
      Eve: Salopette en jean sur un t-shirt blanc, bottes en caoutchouc vertes, cheveux
        blonds attachés en une longue tresse
      Pierre: Chemise à carreaux aux manches retroussées, pantalon de travail beige,
        casquette en toile
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: 'Un grincement retentit : la grande porte de l''étable s''ouvre sur une
        silhouette à contre-jour. Pierre s''avance, une caisse de bidons vides sous
        le bras, et s''arrête net en apercevant Eve.'
      expression: surprise
    - speaker: Pierre
      text: Oh... Bonjour. Je pensais trouver tes parents. Je suis venu pour le lait,
        comme d'habitude.
      expression: surpris
    - speaker: Eve
      text: Tu es en avance, voisin. Mes parents sont partis au marché, tu vas devoir
        te contenter de moi.
      expression: sourire taquin
    - speaker: Pierre
      text: Ce n'est pas un problème, au contraire, je voulais dire... enfin, je ne
        voulais pas te déranger pendant que tu...
      expression: gêné
    - speaker: Narration
      text: Pierre recule d'un pas pour s'excuser et son talon heurte un seau. Il
        vacille, agite les bras et rattrape de justesse la caisse avant de retrouver
        l'équilibre.
      expression: maladroit
    - speaker: Eve
      text: Attention, le seau est de leur côté, pas du tien ! Il ne t'a rien fait,
        pourtant.
      expression: rire
    - speaker: Pierre
      text: Il m'a tendu une embuscade. Je suis un homme courageux, mais je n'avais
        pas prévu d'affronter un seau dès le matin.
      expression: sourire amusé
    - speaker: Eve
      text: Eh bien, tu t'en sors avec les honneurs. Je m'appelle Eve, au fait. On
        se croise depuis des mois, mais on ne s'est jamais vraiment parlé.
      expression: sourire
    - speaker: Pierre
      text: Pierre. Enchanté, Eve. Et pardon pour cette entrée en scène, je n'ai pas
        l'habitude de faire un tel numéro.
      expression: sourire timide
    - speaker: Eve
      text: Ne t'excuse pas, c'était la meilleure chose qui me soit arrivée ce matin.
        Viens, le lait est presque prêt. Et il reste du café, si tu veux.
      expression: sourire chaleureux
