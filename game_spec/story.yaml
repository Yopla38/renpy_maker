  - id: s3
    title: Le tableau électrique respire
    summary: Éloïse conduit Greg à la cave, où se trouve un vieux tableau électrique
      couvert de toiles d'araignée. Quand Greg ouvre le capot, les fusibles palpitent
      doucement comme un cœur, et une voix grésillante murmure « aïe ». Éloïse avoue
      alors que le manoir est vivant et que Greg n'est pas là pour réparer une installation,
      mais pour soigner un patient.
    characters:
    - Greg
    - Éloïse
    location: Cave du manoir, local du tableau électrique
    outfits:
      Greg: Combinaison de travail bleue, gants isolants, lampe frontale allumée
      Éloïse: Longue robe verte, gilet en laine gris, lanterne à la main
    choices: []
    ending: false
    locked: false
    dialogue:
    - speaker: Narration
      text: Un escalier de pierre humide s'enfonce dans la cave. À chaque marche,
        une ampoule nue s'allume au plafond, comme pour guider Greg, puis s'éteint
        derrière lui.
      expression: ambiance inquiétante
    - speaker: Greg
      text: Ça, ce n'est pas un détecteur de présence. Je connais les détecteurs de
        présence. Ils ne font pas ça avec autant de... politesse.
      expression: méfiance
    - speaker: Éloïse
      text: Il essaie d'être aimable. Il a si peu de visites. Voilà, c'est ici.
      expression: sourire timide
    - speaker: Narration
      text: Au fond d'un local étroit, un vieux tableau électrique en fonte gris-vert
        disparaît sous les toiles d'araignée. Greg essuie le capot du revers de la
        manche.
      expression: calme
    - speaker: Greg
      text: Un modèle des années trente, avec des fusibles à porcelaine. Je pensais
        que ça n'existait plus que dans les musées. Bon, on regarde ça.
      expression: curiosité professionnelle
    - speaker: Narration
      text: 'Il soulève le capot. Derrière, les fusibles palpitent doucement, avec
        un rythme lent et régulier, comme un cœur. Un grésillement monte, puis une
        voix presque inaudible murmure : « Aïe. »'
      expression: stupeur
    - speaker: Greg
      text: '...Vous avez entendu ça aussi, n''est-ce pas ? Dites-moi que vous l''avez
        entendu.'
      expression: choc
    - speaker: Éloïse
      text: Je suis désolée, Greg. Je n'ai pas tout dit. Vous n'êtes pas là pour réparer
        une installation. Le manoir est vivant, et vous venez soigner un patient.
      expression: gêne sincère
    - speaker: Greg
      text: Un patient. Moi, je suis électricien, pas médecin. Et mon assurance ne
        couvre sûrement pas les maisons qui parlent.
      expression: incrédulité
    - speaker: Narration
      text: Les fusibles ralentissent, comme retenant leur souffle. Greg garde la
        main un instant au-dessus du tableau, puis la pose doucement sur la fonte
        tiède.
      expression: hésitation
    - speaker: Greg
      text: D'accord, du calme. Je vais regarder ce qui ne va pas. Mais si je dois
        couper quoi que ce soit, je vous préviens d'abord. Ça vaut pour vous aussi,
        le manoir.
      expression: résignation douce
    - speaker: Éloïse
      text: Merci. Je crois qu'il vient de se détendre un peu.
      expression: soulagement
