  - id: s3
    title: Les bidons de lait
    summary: Eve aide Pierre à charger les bidons dans sa camionnette tout en lui
      posant des questions sur sa propre exploitation. Ils découvrent qu'ils partagent
      les mêmes soucis et les mêmes rêves de campagne. Au moment de se quitter, Pierre
      propose de revenir plus tôt la prochaine fois, et Eve accepte avec un sourire
      qu'elle ne cherche pas à cacher.
    characters:
    - Eve
    - Pierre
    location: Cour de la ferme, devant l'étable
    outfits:
      Eve: Salopette en jean sur un t-shirt blanc, bottes en caoutchouc vertes, cheveux
        blonds en tresse légèrement défaite
      Pierre: Chemise à carreaux aux manches retroussées, pantalon de travail beige,
        casquette en toile
    choices: []
    ending: true
    locked: false
    dialogue:
    - speaker: Narration
      text: Dans la cour, le soleil du matin chauffe déjà les pavés. Eve fait rouler
        un premier bidon de lait jusqu'à la camionnette de Pierre, garée devant l'étable.
      expression: neutre
    - speaker: Eve
      text: Attention, celui-là est plein à ras bord. Tu le prends par l'anse, sinon
        tu vas encore en mettre partout.
      expression: sourire moqueur
    - speaker: Pierre
      text: Je vais essayer de ne pas battre mon record de maladresse du jour. Dis-moi,
        tu fais tout ça toute seule, d'habitude ?
      expression: amusé
    - speaker: Eve
      text: Avec mes parents, oui. Mais ce matin, ils sont au marché. Et toi, ta ferme,
        ça donne quoi ? Je ne sais même pas combien de bêtes tu as.
      expression: curiosité
    - speaker: Pierre
      text: Une vingtaine de vaches et quelques hectares de prairie. Le plus dur,
        c'est de tenir avec les prix du lait. Chaque mois, je refais mes comptes en
        croisant les doigts.
      expression: soucieux
    - speaker: Eve
      text: Ah, ça, je connais. Mon père passe ses soirées sur ses factures en soupirant.
        Moi, je rêve d'un jour où on pourrait vendre notre fromage directement, sans
        intermédiaire.
      expression: rêveuse
    - speaker: Pierre
      text: Sérieusement ? J'y pense depuis des années ! Une petite fromagerie, un
        panneau au bord de la route... Je n'en ai jamais parlé à personne.
      expression: surpris
    - speaker: Eve
      text: Alors nous voilà deux fous. C'est étrange, on vit à deux pas l'un de l'autre
        et on découvre ça seulement aujourd'hui.
      expression: sourire sincère
    - speaker: Narration
      text: Pierre referme les portes de la camionnette. Il hésite un instant, la
        main sur la poignée, comme s'il n'osait pas partir.
      expression: hésitation
    - speaker: Pierre
      text: La semaine prochaine, je pourrais passer un peu plus tôt. Pour t'aider
        avec la traite, et pour qu'on continue de parler de nos projets.
      expression: timide
    - speaker: Eve
      text: Avec plaisir. Viens dès l'aube si tu veux, je mettrai le café à chauffer.
      expression: grand sourire
